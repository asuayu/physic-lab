name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy physics
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 47043a206554e7ec3527298aefbc0bc0
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      COMMENTS_ADMIN_TOKEN: ${{ secrets.COMMENTS_ADMIN_TOKEN }}
      COMMENTS_HASH_SALT: ${{ secrets.COMMENTS_HASH_SALT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build site
        run: npm run validate

      - name: Deploy to Cloudflare Workers
        if: env.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        run: |
          set +e
          OUTPUT="$(npx wrangler deploy 2>&1)"
          STATUS=$?
          set -e

          printf '%s\n' "$OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            SUMMARY="$(printf '%s\n' "$OUTPUT" | tail -n 25 | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=Cloudflare Workers deployment failed::$SUMMARY"
            exit "$STATUS"
          fi
      - name: Apply D1 migrations
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler d1 migrations apply COMMENTS_DB --remote

      - name: Configure optional comment secrets
        if: env.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        run: |
          SECRETS="$(jq -n \
            --arg site "$TURNSTILE_SITE_KEY" \
            --arg secret "$TURNSTILE_SECRET_KEY" \
            --arg admin "$COMMENTS_ADMIN_TOKEN" \
            --arg salt "$COMMENTS_HASH_SALT" \
            '{}
             | if ($site | length) > 0 then .TURNSTILE_SITE_KEY = $site else . end
             | if ($secret | length) > 0 then .TURNSTILE_SECRET_KEY = $secret else . end
             | if ($admin | length) > 0 then .COMMENTS_ADMIN_TOKEN = $admin else . end
             | if ($salt | length) > 0 then .COMMENTS_HASH_SALT = $salt else . end')"

          if [ "$SECRETS" != "{}" ]; then
            printf '%s' "$SECRETS" | npx wrangler secret bulk
          else
            echo "No optional comment secrets configured; comments remain available with D1 rate limiting."
          fi

      - name: Verify comments API
        if: env.CLOUDFLARE_API_TOKEN != ''
        shell: bash
        run: curl --fail --show-error --retry 5 --retry-delay 3 https://hunag-physics.top/api/comments/health

      - name: Cloudflare token is not configured
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret, then rerun this workflow."

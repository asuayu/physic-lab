name: Validate and deploy Physics Lab

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Content, types, behavior and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: validate-${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      ASTRO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run validate:full
      - uses: actions/upload-artifact@v4
        with:
          name: validated-site
          path: dist/
          retention-days: 7

  deploy:
    name: Publish validated production artifact
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: physics-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 47043a206554e7ec3527298aefbc0bc0
      TURNSTILE_SITE_KEY: ${{ secrets.TURNSTILE_SITE_KEY }}
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      COMMENTS_ADMIN_TOKEN: ${{ secrets.COMMENTS_ADMIN_TOKEN }}
      COMMENTS_HASH_SALT: ${{ secrets.COMMENTS_HASH_SALT }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: validated-site
          path: dist/
      - name: Validate production configuration
        shell: bash
        run: |
          set -euo pipefail
          for NAME in CLOUDFLARE_API_TOKEN COMMENTS_ADMIN_TOKEN COMMENTS_HASH_SALT; do
            if [ -z "${!NAME}" ]; then
              echo "::error::Required secret $NAME is missing."
              exit 1
            fi
          done
          if { [ -n "$TURNSTILE_SITE_KEY" ] && [ -z "$TURNSTILE_SECRET_KEY" ]; } || { [ -z "$TURNSTILE_SITE_KEY" ] && [ -n "$TURNSTILE_SECRET_KEY" ]; }; then
            echo "::error::TURNSTILE_SITE_KEY and TURNSTILE_SECRET_KEY must be configured together."
            exit 1
          fi
      # Only additive, backward-compatible migrations belong in this release step.
      - name: Apply compatible D1 migrations before code activation
        run: npx wrangler d1 migrations apply COMMENTS_DB --remote
      - name: Configure comment secrets
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg site "$TURNSTILE_SITE_KEY" \
            --arg secret "$TURNSTILE_SECRET_KEY" \
            --arg admin "$COMMENTS_ADMIN_TOKEN" \
            --arg salt "$COMMENTS_HASH_SALT" \
            '{COMMENTS_ADMIN_TOKEN:$admin,COMMENTS_HASH_SALT:$salt}
             | if ($site | length) > 0 then .TURNSTILE_SITE_KEY = $site | .TURNSTILE_SECRET_KEY = $secret else . end' \
            | npx wrangler secret bulk
      - name: Publish Worker and validated static assets
        run: npx wrangler deploy
      - name: Check readiness and read a real comment list
        env:
          COMMENTS_PROBE_URL: https://huang-physics.top
        run: node scripts/probe-comments.mjs

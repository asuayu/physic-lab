<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轮子滚动与摆线轨迹 (Physics Lab)</title>
    <style>
        :root {
            /* 现代深色主题配色 */
            --bg-main: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            /* 核心元素颜色 */
            --accent: #ec4899;        /* 轨迹：霓虹粉 */
            --wheel-border: #38bdf8;  
            
            /* UI图例颜色与下方 JS 中 COLORS 保持一致 */
            --v-trans: #4ade80;       /* 匀速平动：绿色 */
            --v-rot: #ff4d4d;         /* 圆周转动：红色 */
            --v-tot: #ffd700;         /* 合成速度：黄色 */
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .controls {
            width: 290px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 4px 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            border-right: 1px solid #334155;
            overflow-y: auto;
        }

        .controls::-webkit-scrollbar { width: 6px; }
        .controls::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

        h2 { 
            margin: 0; 
            font-size: 1.4rem; 
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2::before {
            content: '';
            display: block;
            width: 5px;
            height: 24px;
            background: var(--wheel-border);
            border-radius: 4px;
        }
        
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        
        label { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.95rem; 
            color: var(--text-muted); 
            font-weight: 500;
        }
        
        button {
            width: 100%;
            padding: 12px;
            background: #334155;
            border: 1px solid #475569;
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.95rem;
        }
        button:hover { background: #475569; }
        button.active { 
            background: rgba(56, 189, 248, 0.2); 
            color: var(--wheel-border); 
            border-color: var(--wheel-border); 
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.1);
        }
        
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        .btn-group button { flex: 1; margin: 0; }
        button.action-play { background: var(--accent); color: white; border: none; }
        button.action-play:hover { background: #db2777; box-shadow: 0 0 15px rgba(236, 72, 153, 0.4); }

        input[type="range"] { 
            width: 100%; 
            cursor: pointer; 
            accent-color: var(--wheel-border);
        }

        .legend { 
            font-size: 0.9rem; 
            background: rgba(15, 23, 42, 0.5); 
            padding: 16px; 
            border-radius: 8px; 
            margin-top: auto; 
            border: 1px solid #334155;
        }
        .legend-item { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .legend-item:last-child { margin-bottom: 0; }
        .dot { width: 14px; height: 14px; border-radius: 4px; }

        .canvas-container {
            flex-grow: 1;
            position: relative;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px; 
        }
        canvas { display: block; width: 100%; height: 100%; }

        .status {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(4px);
            padding: 16px 24px;
            border-radius: 12px;
            pointer-events: none;
            font-family: monospace;
            font-size: 15px;
            border: 1px solid #334155;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            line-height: 1.6;
            color: var(--text-muted);
        }
        .highlight { color: var(--wheel-border); font-weight: bold; font-size: 1.1em;}
        .highlight-pink { color: var(--accent); font-weight: bold;}

        .btn-home {
            position: absolute; 
            top: 15px; 
            right: 25px; 
            z-index: 9999; 
            padding: 6px 12px; 
            background: rgba(30, 41, 59, 0.9); 
            border: 1px solid #334155; 
            color: var(--text-muted); 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 0.85rem;
            transition: all 0.2s ease-in-out;
        }
        .btn-home:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(236, 72, 153, 0.1);
        }

    </style>
    <link rel="stylesheet" href="/lab-common.css">
    <script src="/lab-runtime.js"></script>
</head>
<body>
<a href="/" class="btn-home"> 🏠 返回展厅 </a>
<div class="controls">
    <h2>物理轨迹仿真</h2>
    
    <div class="control-group">
        <label>快速情景切换：</label>
        <button id="btn-equal" class="active" onclick="setMode('equal')">v = ωr (纯滚动：普通摆线)</button>
        <button id="btn-greater" onclick="setMode('greater')">v > ωr (向前滑动：短幅摆线)</button>
        <button id="btn-less" onclick="setMode('less')">v < ωr (原地打滑：长幅摆线)</button>
    </div>

    <div class="control-group" style="margin-top: 15px;">
        <label><span>平动/转动比 (v / ωr):</span> <span id="val_ratio" class="highlight">1.0</span></label>
        <input type="range" id="input_ratio" min="0.2" max="2.5" step="0.1" value="1.0">
    </div>

    <div class="control-group" style="margin-top: 5px;">
        <label style="justify-content: flex-start; gap: 10px; cursor: pointer; color: var(--text-main);">
            <input type="checkbox" id="showVectors" checked style="width: 18px; height: 18px;"> 实时显示速度矢量
        </label>
    </div>

    <div class="btn-group" style="margin-top: 15px;">
        <button id="btnRestart" onclick="resetSim()">↺ 重置</button>
        <button id="btnPause" class="action-play" onclick="togglePause()">⏸ 暂停 / 继续</button>
    </div>

    <div class="legend">
        <strong style="color:var(--text-main); display:block; margin-bottom:12px;">速度矢量图例：</strong>
        <div class="legend-item"><div class="dot" style="background:var(--v-trans)"></div> <span style="color:var(--v-trans); font-weight:bold;">匀速 (v)</span> <span style="color:var(--text-muted)">- 绿色整体向右</span></div>
        <div class="legend-item"><div class="dot" style="background:var(--v-rot)"></div> <span style="color:var(--v-rot); font-weight:bold;">圆周 (ωr)</span> <span style="color:var(--text-muted)">- 红色切线旋转</span></div>
        <div class="legend-item"><div class="dot" style="background:var(--v-tot)"></div> <span style="color:var(--v-tot); font-weight:bold;">合成 (v_总)</span> <span style="color:var(--text-muted)">- 黄色真实速度</span></div>
    </div>
</div>

<div class="canvas-container" id="canvas-container">
    <div class="status" id="statusBox">加载中...</div>
    <canvas id="simCanvas" role="img" tabindex="0" aria-label="轮子滚动、速度矢量叠加与摆线轨迹仿真"></canvas>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    // ======== 解决 Canvas 不识别 var() 的核心：声明 JS 颜色常量 ========
    const COLORS = {
        ground: '#475569',
        accent: '#ec4899',       // 轨迹粉色
        wheelFill: 'rgba(56, 189, 248, 0.15)',
        wheelBorder: '#38bdf8',
        spoke: 'rgba(56, 189, 248, 0.6)',
        vTrans: '#4ade80',       // 匀速箭头：绿色
        vRot: '#ff4d4d',         // 圆周箭头：红色
        vTot: '#ffd700'          // 合成箭头：黄色
    };
    
    // 基础物理常量
    const R = 75;              
    const omega = 0.035;       
    const v_rot_mag = omega * R; 
    
    let state = {
        ratio: 1.0,
        t: 0,
        points: [],
        running: true,
        groundY: 0
    };

    let animationId = null;
    let lastFrameTime = 0;

    function resize() {
        const container = document.getElementById('canvas-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        state.groundY = canvas.height - 120; 
        resetSim();
    }
    window.addEventListener('resize', resize);

    // UI 元素
    const ui = {
        ratioSlider: document.getElementById('input_ratio'),
        ratioVal: document.getElementById('val_ratio'),
        showVectors: document.getElementById('showVectors'),
        status: document.getElementById('statusBox'),
        btns: {
            'equal': document.getElementById('btn-equal'),
            'greater': document.getElementById('btn-greater'),
            'less': document.getElementById('btn-less')
        }
    };

    function setMode(mode) {
        Object.values(ui.btns).forEach(btn => btn.classList.remove('active'));
        ui.btns[mode].classList.add('active');

        if (mode === 'equal') state.ratio = 1.0;
        else if (mode === 'greater') state.ratio = 1.8;
        else if (mode === 'less') state.ratio = 0.4;

        ui.ratioSlider.value = state.ratio;
        updateUI();
        resetSim();
    }

    ui.ratioSlider.addEventListener('input', (e) => {
        state.ratio = parseFloat(e.target.value);
        Object.values(ui.btns).forEach(btn => btn.classList.remove('active'));
        updateUI();
        resetSim();
    });

    function updateUI() {
        ui.ratioVal.textContent = state.ratio.toFixed(1);
        
        let type = "", desc = "";
        if (state.ratio === 1) {
            type = "普通摆线 (Cycloid)";
            desc = "触地点匀速与圆周速度完全抵消，瞬时绝对合成速度为 0。";
        } else if (state.ratio > 1) {
            type = "短幅摆线 (Curtate Cycloid)";
            desc = "匀速平动超前，相当于车轮抱死向前滑动，无尖点。";
        } else {
            type = "长幅摆线 (Prolate Cycloid)";
            desc = "圆周转动超前，相当于起步原地打滑，轨迹打结回环。";
        }

        ui.status.innerHTML = `
            <div style="margin-bottom:8px">当前比例: <span class="highlight">${state.ratio.toFixed(1)}</span></div>
            <div style="margin-bottom:12px">轨迹类型: <span class="highlight-pink">${type}</span></div>
            <div style="font-size:13px; max-width: 320px; white-space: normal; line-height: 1.5;">${desc}</div>
        `;
    }

    function resetSim() {
        state.t = 0;
        state.points = [];
        
        if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
        
        if (state.running) {
            lastFrameTime = 0;
            animationId = requestAnimationFrame(animate);
        } else {
            drawFrame(); 
        }
    }

    function togglePause() {
        state.running = !state.running;
        if (state.running) {
            lastFrameTime = 0;
            animationId = requestAnimationFrame(animate);
        } else if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
    }

    function drawArrow(x, y, vx, vy, color, width) {
        if (Math.abs(vx) < 0.1 && Math.abs(vy) < 0.1) return;
        const scale = 18; 
        const endX = x + vx * scale;
        const endY = y + vy * scale;
        
        ctx.beginPath(); 
        ctx.moveTo(x, y); 
        ctx.lineTo(endX, endY);
        ctx.strokeStyle = color; 
        ctx.lineWidth = width; 
        ctx.lineCap = 'round';
        ctx.stroke();

        const angle = Math.atan2(vy, vx);
        const headLen = 12;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX - headLen * Math.cos(angle - Math.PI / 7), endY - headLen * Math.sin(angle - Math.PI / 7));
        ctx.lineTo(endX - headLen * Math.cos(angle + Math.PI / 7), endY - headLen * Math.sin(angle + Math.PI / 7));
        ctx.fillStyle = color; 
        ctx.fill();
    }

    function drawFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const v_trans = state.ratio * v_rot_mag; 
        const startX = 120;
        
        let cx = startX + v_trans * state.t; 
        let cy = state.groundY - R;         
        let theta = omega * state.t;         
        
        if (cx - R > canvas.width) { 
            resetSim(); 
            return false; 
        }

        let px = cx - R * Math.sin(theta);
        let py = cy + R * Math.cos(theta);

        if (state.running || state.points.length === 0) {
            state.points.push({x: px, y: py});
        }

        // 1. 绘制地面 
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        ctx.fillRect(0, state.groundY, canvas.width, canvas.height - state.groundY);
        ctx.beginPath(); 
        ctx.moveTo(0, state.groundY); 
        ctx.lineTo(canvas.width, state.groundY);
        ctx.strokeStyle = COLORS.ground; // <--- 修复处：使用常量
        ctx.lineWidth = 4; 
        ctx.stroke();

        // 2. 绘制轨迹 
        if (state.points.length > 1) {
            ctx.beginPath(); 
            ctx.moveTo(state.points[0].x, state.points[0].y);
            for (let i = 1; i < state.points.length; i++) {
                ctx.lineTo(state.points[i].x, state.points[i].y);
            }
            ctx.strokeStyle = COLORS.accent; // <--- 修复处
            ctx.lineWidth = 4; 
            ctx.lineJoin = 'round';
            
            ctx.shadowBlur = 12;
            ctx.shadowColor = COLORS.accent; // <--- 修复处
            ctx.stroke();
            
            ctx.shadowBlur = 0;
        }

        // 3. 绘制轮子
        ctx.beginPath(); 
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fillStyle = COLORS.wheelFill; // <--- 修复处
        ctx.fill();
        ctx.strokeStyle = COLORS.wheelBorder; // <--- 修复处
        ctx.lineWidth = 3; 
        ctx.stroke();

        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
            let spokeAngle = theta + (Math.PI / 2) * i;
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx - R * Math.sin(spokeAngle), cy + R * Math.cos(spokeAngle));
        }
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = COLORS.spoke; // <--- 修复处
        ctx.lineWidth = 2; 
        ctx.stroke();
        ctx.setLineDash([]); 

        ctx.beginPath(); 
        ctx.moveTo(cx, cy); 
        ctx.lineTo(px, py);
        ctx.strokeStyle = COLORS.wheelBorder; // <--- 修复处
        ctx.lineWidth = 3; 
        ctx.stroke();

        // 4. 绘制速度矢量
        if (ui.showVectors.checked) {
            let vx_rot = -v_rot_mag * Math.cos(theta);
            let vy_rot = -v_rot_mag * Math.sin(theta);
            
            // <--- 修复处：直接传递 JS 中的十六进制颜色变量，保证 100% 生效
            drawArrow(cx, cy, v_trans, 0, COLORS.vTrans, 3); // 轮心匀速 (绿)
            drawArrow(px, py, v_trans, 0, COLORS.vTrans, 3); // 追踪点匀速 (绿)
            drawArrow(px, py, vx_rot, vy_rot, COLORS.vRot, 3); // 追踪点圆周 (红)
            drawArrow(px, py, v_trans + vx_rot, vy_rot, COLORS.vTot, 4); // 合成速度 (黄)
        }

        // 5. 绘制追踪点与轮心
        ctx.beginPath(); 
        ctx.arc(px, py, 7, 0, Math.PI * 2); 
        ctx.fillStyle = COLORS.accent; // <--- 修复处
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath(); 
        ctx.arc(cx, cy, 5, 0, Math.PI * 2); 
        ctx.fillStyle = '#fff'; 
        ctx.fill();

        return true; 
    }

    function animate(timestamp) {
        if (!state.running) return;

        const frameScale = PhysicsLab.frameScale(timestamp, lastFrameTime);
        lastFrameTime = timestamp;
        
        let shouldContinue = drawFrame();
        
        if (shouldContinue) {
            state.t += frameScale;
            animationId = requestAnimationFrame(animate);
        } else {
            animationId = null;
        }
    }

    // 初始化
    setTimeout(() => {
        resize();
        updateUI();
    }, 100); 

</script>
</body>
</html>

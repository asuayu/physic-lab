<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">圆环碰撞与加权弧速率</title><desc id="desc">蓝色 A、绿色 B 在圆环运动，橙色菱形 P 是恒速辅助点；右侧为展开弧坐标示意。</desc>
  <rect width="800" height="450" fill="#f2f5f5"/>
  <rect x="28" y="28" width="744" height="394" rx="24" fill="#fff" stroke="#e0e7eb"/>
  <text x="62" y="83" font-family="sans-serif" font-size="25" font-weight="700" fill="#24384d">圆环碰撞 · 加权弧速率</text>
  <circle cx="231" cy="245" r="113" fill="#f8fafc" stroke="#a8b8c8" stroke-width="9"/>
  <circle cx="231" cy="245" r="3" fill="#718196"/>
  <path d="M231 245 L288 147" stroke="#c27520" stroke-dasharray="6 6"/>
  <circle cx="337" cy="285" r="13" fill="#2866ad" stroke="#fff" stroke-width="3"/>
  <rect x="119" y="184" width="22" height="22" rx="4" fill="#328873" stroke="#fff" stroke-width="3"/>
  <path d="M288 134 L301 147 L288 160 L275 147Z" fill="#fff" stroke="#c27520" stroke-width="3"/>
  <g font-family="sans-serif" font-size="20" font-weight="700"><text x="355" y="295" fill="#2866ad">A</text><text x="95" y="182" fill="#328873">B</text><text x="306" y="137" fill="#c27520">P</text></g>
  <g fill="none" stroke-width="3"><path d="M440 330 V150 M440 330 H720" stroke="#b9c5d0" stroke-width="1.5"/><path d="M440 330 L535 270 L712 164" stroke="#c27520" stroke-dasharray="7 5"/><path d="M440 330 L535 298 L712 164" stroke="#2866ad"/><path d="M440 330 L535 214 L712 164" stroke="#328873"/></g>
  <g font-family="sans-serif" fill="#6e8193" font-size="17"><text x="466" y="365">Q = (mₐsₐ + mᵦsᵦ) / M</text><text x="470" y="127" fill="#a66924">V = dQ/dt 恒定</text></g>
</svg>

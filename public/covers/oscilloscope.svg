<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="title desc">
  <title id="title">示波器扫描波形</title><desc id="desc">绿色荧光屏上显示两周期正弦曲线与扫描光点</desc>
  <defs><radialGradient id="bg"><stop stop-color="#174a31"/><stop offset="1" stop-color="#06110c"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="58" height="47" patternUnits="userSpaceOnUse"><path d="M58 0H0V47" fill="none" stroke="#5ba978" stroke-opacity=".22"/></pattern></defs>
  <rect width="640" height="400" fill="url(#bg)"/><circle cx="520" cy="-5" r="220" fill="#5cff9b" opacity=".08"/>
  <rect x="45" y="55" width="550" height="290" rx="25" fill="#020a06" stroke="#387653" stroke-width="3"/><rect x="66" y="77" width="508" height="246" rx="12" fill="url(#grid)"/>
  <path d="M66 200H574M320 77V323" stroke="#8ed6aa" stroke-opacity=".3"/>

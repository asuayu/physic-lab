<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">半波损失动态演示封面</title><desc id="desc">光波在低折射率到高折射率界面反射时发生π相位突变，并产生薄膜干涉和牛顿环</desc>
  <defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#122e48"/><stop offset="1" stop-color="#06101d"/></linearGradient><linearGradient id="glass" x2="1"><stop stop-color="#38bdf8" stop-opacity=".08"/><stop offset="1" stop-color="#a78bfa" stop-opacity=".3"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <rect width="800" height="450" fill="url(#bg)"/><rect x="410" y="0" width="390" height="450" fill="url(#glass)"/><path d="M410 58V392" stroke="#e2e8f0" stroke-width="3"/>
  <g fill="none" stroke-linecap="round" filter="url(#glow)"><path d="M48 176q28-62 56 0t56 0t56 0t56 0t56 0t56 0" stroke="#67e8f9" stroke-width="4"/><path d="M48 285q28 62 56 0t56 0t56 0t56 0t56 0t56 0" stroke="#d8b4fe" stroke-width="4"/><path d="M410 176q23-42 46 0t46 0t46 0t46 0t46 0t46 0" stroke="#67e8f9" stroke-width="4"/></g>
  <path d="M335 130l55 46-55 46" fill="none" stroke="#67e8f9" stroke-width="4"/><path d="M335 239l55 46-55 46" fill="none" stroke="#d8b4fe" stroke-width="4"/><circle cx="670" cy="302" r="74" fill="none" stroke="#60a5fa" stroke-width="11"/><circle cx="670" cy="302" r="53" fill="none" stroke="#172554" stroke-width="10"/><circle cx="670" cy="302" r="34" fill="none" stroke="#60a5fa" stroke-width="9"/><circle cx="670" cy="302" r="15" fill="#030712"/>
  <g font-family="Microsoft YaHei,Segoe UI,sans-serif"><text x="42" y="58" fill="#fff" font-size="34" font-weight="700">半波损失 · π 相位突变</text><text x="47" y="410" fill="#9edfff" font-size="21">低 n → 高 n：反射电场反号　π ↔ λ/2</text><text x="205" y="116" fill="#67e8f9" font-size="19" text-anchor="middle">入射波</text><text x="205" y="352" fill="#d8b4fe" font-size="19" text-anchor="middle">反射波翻相</text><text x="602" y="116" fill="#e9d5ff" font-size="20" text-anchor="middle">n₂ &gt; n₁</text></g>
</svg>

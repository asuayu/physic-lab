<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>平抛运动与自由落体对比验证 (Physics Lab)</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --accent: #22c55e;       /* 核心主色调: 鲜萃绿 */
            --ball-a: #ef4444;       /* 自由落体 A球 红色 */
            --ball-b: #3b82f6;       /* 平抛 B球 蓝色 */
            --line-color: rgba(255, 255, 255, 0.6); /* 同步连线色 */
            --grid-line: rgba(255, 255, 255, 0.05); /* 网格线 */
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .controls {
            width: 320px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 4px 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            border-right: 1px solid #334155;
            overflow-y: auto;
        }
        .controls::-webkit-scrollbar { width: 6px; }
        .controls::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

        h2 { 
            margin: 0; 
            font-size: 1.3rem; 
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2::before {
            content: '';
            display: block;
            width: 5px;
            height: 24px;
            background: var(--accent);
            border-radius: 4px;
        }
        
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        
        label { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.95rem; 
            color: var(--text-muted); 
            font-weight: 500;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background: #334155;
            border: 1px solid #475569;
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.95rem;
        }
        button:hover { background: #475569; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        .btn-group button { flex: 1; margin: 0; }
        button.action-play { background: var(--accent); color: #fff; border: none; }
        button.action-play:hover { background: #16a34a; box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }

        input[type="range"] { 
            width: 100%; 
            cursor: pointer; 
            accent-color: var(--accent);
        }

        .legend { 
            font-size: 0.85rem; 
            background: rgba(15, 23, 42, 0.5); 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: auto; 
            border: 1px solid #334155;
        }

        .canvas-container {
            flex-grow: 1;
            position: relative;
            background-color: var(--bg-main);
        }
        canvas { display: block; width: 100%; height: 100%; }

        .status-box {
            position: absolute;
            top: 64px;
            right: 24px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(4px);
            padding: 16px 20px;
            border-radius: 12px;
            pointer-events: none;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #334155;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            line-height: 1.6;
            color: var(--text-muted);
            min-width: 250px;
        }
        .highlight { color: var(--accent); font-weight: bold;}

        .btn-home {
            position: absolute; 
            top: 15px; 
            right: 25px; 
            z-index: 9999; 
            padding: 6px 12px; 
            background: rgba(30, 41, 59, 0.9); 
            border: 1px solid #334155; 
            color: var(--text-muted); 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 0.85rem;
            transition: all 0.2s ease-in-out;
        }
        .btn-home:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(34, 197, 94, 0.1);
        }
    </style>
    <link rel="stylesheet" href="/lab-common.css">
    <script src="/lab-runtime.js"></script>
</head>
<body>
<a href="/" class="btn-home"> 🏠 返回展厅 </a>
<div class="controls">
    <h2>平抛运动的等时独立性</h2>
    
    <div style="font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; margin-bottom:10px;">
        在真空中，平抛运动在垂直方向上与自由落体运动完全等效，二者将遵循同一数学方程 <code>y = ½gt²</code>。
    </div>

    <div class="control-group" style="margin-top: 10px;">
        <label><span>B球水平初速度 v₀:</span> <span id="val_v0" class="highlight" style="color:var(--ball-b)">150</span> px/s</label>
        <input type="range" id="input_v0" min="50" max="600" step="10" value="150">
    </div>

    <div class="control-group" style="margin-top: 10px;">
        <label><span>理论重力系数 g:</span> <span id="val_g" class="highlight">300</span> px/s²</label>
        <!-- 固定常量仅做展示，或可以设为只读滑动条 -->
        <input type="range" id="input_g" min="100" max="800" step="10" value="300" disabled style="opacity: 0.5;">
    </div>

    <div class="control-group" style="margin-top: 10px;">
        <label style="justify-content: flex-start; gap: 10px; cursor: pointer; color: var(--text-main);">
            <input type="checkbox" id="showLine" checked style="width: 16px; height: 16px;"> 动态显示等高辅助连线
        </label>
        <label style="justify-content: flex-start; gap: 10px; cursor: pointer; color: var(--text-main);">
            <input type="checkbox" id="showGhost" checked style="width: 16px; height: 16px;"> 显示小球运动拖影
        </label>
    </div>

    <div class="btn-group" style="margin-top: 15px;">
        <button id="btnRestart" onclick="resetSim()">↺ 重置塔顶</button>
        <button id="btnPlay" class="action-play" onclick="startSim()">⚡ 发射 / 下落</button>
    </div>

    <div class="legend">
        <strong style="color:var(--text-main); display:block; margin-bottom:8px;">元素图例：</strong>
        <div style="margin-bottom: 4px;"><span style="color:var(--ball-a); font-weight:bold;">● 红色A球</span>: 自由落身 (v₀=0, a=g)</div>
        <div style="margin-bottom: 4px;"><span style="color:var(--ball-b); font-weight:bold;">● 蓝色B球</span>: 前方平抛 (v₀>0, a=g)</div>
        <div style="margin-bottom: 4px; color:var(--text-muted); font-size: 11px;">(背部灰色线条为间距 50px 的正交坐标参考网格)</div>
    </div>
</div>

<div class="canvas-container" id="canvas-container">
    <div class="status-box" id="statusBox">加载中...</div>
    <canvas id="simCanvas" role="img" tabindex="0" aria-label="平抛运动与自由落体竖直方向等时对比仿真"></canvas>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    // 物理全局常量
    let g = 300;     // 重力加速度 px/s^2    
    let startY = 100; // 悬挑基准起点高度 Y
    let startXa = 100; // A 球 x坐标
    let startXb = 180; // B 球 初始x坐标
    let groundY = 0;   // 地面高度 Y (动态计算)

    let state = {
        v0: 150,     // B球初速度
        t: 0,        // 物理流逝时间 (秒)
        
        y: 100,      // A, B 共用的高度
        xA: 100,     // A 的 X
        xB: 180,     // B 的 X
        
        historyA: [],
        historyB: [],
        
        running: false,
        finished: false,
        lastRealTime: 0
    };

    let animationId = null;

    // UI 绑定
    const ui = {
        sliderV0: document.getElementById('input_v0'),
        valV0: document.getElementById('val_v0'),
        showLine: document.getElementById('showLine'),
        showGhost: document.getElementById('showGhost'),
        status: document.getElementById('statusBox'),
        btnPlay: document.getElementById('btnPlay'),
        btnRestart: document.getElementById('btnRestart')
    };

    function resize() {
        const container = document.getElementById('canvas-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        
        // 动态适配地面、发射台左边缘距
        groundY = canvas.height - 40; 
        
        if(!state.running && !state.finished) resetSim();
        else drawFrame();
    }
    window.addEventListener('resize', resize);

    ui.sliderV0.addEventListener('input', (e) => {
        state.v0 = parseFloat(e.target.value);
        ui.valV0.textContent = state.v0;
        if (!state.running && !state.finished) {
            drawFrame(); // 更新起步箭头预览
        }
    });

    function resetSim() {
        state.t = 0;
        state.y = startY;
        state.xA = startXa;
        state.xB = startXb;
        state.historyA = [];
        state.historyB = [];
        state.running = false;
        state.finished = false;
        
        ui.btnPlay.innerHTML = '⚡ 发射 / 下落';
        ui.btnPlay.classList.add('action-play');
        ui.btnPlay.style.background = 'var(--accent)';
        
        updateStatus();
        drawFrame();
    }

    function startSim() {
        if (state.finished) {
            resetSim(); // 重置后再跑
        }
        
        if (!state.running) {
            state.running = true;
            state.lastRealTime = performance.now();
            ui.btnPlay.innerHTML = '⏸ 暂停';
            ui.btnPlay.style.background = '#eab308'; // 黄色暂停
            animate();
        } else {
            state.running = false;
            ui.btnPlay.innerHTML = '▶ 继续下落';
            ui.btnPlay.style.background = 'var(--accent)';
        }
    }

    function updateStatus() {
        const droppedY = state.y - startY; // 下落绝对落差

        let info = "";
        if (state.finished) info = `<span style="color:#22c55e">✅ 接触地面 (同时落地)</span>`;
        else if (state.running) info = `<span style="color:#eab308">加速下落中...</span>`;
        else info = `等待发射令`;

        ui.status.innerHTML = `
            <div style="margin-bottom:8px; font-weight:bold;">${info}</div>
            <div style="margin-bottom:4px">当前耗时 <span style="color:#fff">t</span>: ${(state.t).toFixed(3)} s</div>
            <div style="margin-bottom:4px">下落深度 <span style="color:#fff">y</span>: ${droppedY.toFixed(1)} px (等式: ½gt²)</div>
            <div style="margin-bottom:4px">A球位移 <span style="color:#ef4444">x_A</span>: 0.0 px</div>
            <div style="margin-bottom:4px">B球位移 <span style="color:#3b82f6">x_B</span>: ${(state.xB - startXb).toFixed(1)} px (等式: v₀t)</div>
            <hr style="border-color:#334155; margin:8px 0;">
            <div style="margin-bottom:4px; font-size: 0.9em; color:#94a3b8">B瞬间垂直分速(vy): ${(g*state.t).toFixed(1)} px/s</div>
        `;
    }

    function drawGrid(ctx) {
        ctx.beginPath();
        const gridSize = 50;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
        ctx.lineWidth = 1;
        
        for (let x = 0; x <= canvas.width; x += gridSize) {
            ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height);
        }
        for (let y = 0; y <= canvas.height; y += gridSize) {
            ctx.moveTo(0, y); ctx.lineTo(canvas.width, y);
        }
        ctx.stroke();
    }

    function drawArrow(ctx, x, y, dx, dy, color, width) {
        if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) return;
        const endX = x + dx;
        const endY = y + dy;
        
        ctx.beginPath(); 
        ctx.moveTo(x, y); 
        ctx.lineTo(endX, endY);
        ctx.strokeStyle = color; 
        ctx.lineWidth = width; 
        ctx.lineCap = 'round';
        ctx.stroke();

        const angle = Math.atan2(dy, dx);
        const headLen = 8;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX - headLen * Math.cos(angle - Math.PI / 7), endY - headLen * Math.sin(angle - Math.PI / 7));
        ctx.lineTo(endX - headLen * Math.cos(angle + Math.PI / 7), endY - headLen * Math.sin(angle + Math.PI / 7));
        ctx.fillStyle = color; 
        ctx.fill();
    }

    function drawFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        drawGrid(ctx);

        // ==== 背景环境 ====
        // 画地平线
        ctx.beginPath();
        ctx.moveTo(0, groundY); 
        ctx.lineTo(canvas.width, groundY);
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 4;
        ctx.stroke();
        
        ctx.fillStyle = 'rgba(15, 23, 42, 0.9)'; // 地下的填色
        ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);

        // 绘制支撑发射台的阴影塔
        ctx.fillStyle = '#1e293b';
        ctx.fillRect(startXb - 60, startY, 40, groundY - startY); // B桥墩
        ctx.fillRect(startXa - 20, startY, 40, groundY - startY); // A桥墩

        // 绘制顶层发射板
        ctx.beginPath();
        ctx.moveTo(startXa - 40, startY);
        ctx.lineTo(startXb + 40, startY);
        ctx.strokeStyle = '#94a3b8';
        ctx.lineWidth = 4;
        ctx.stroke();

        // ==== 拖影绘制 ====
        if (ui.showGhost.checked) {
            ctx.lineCap = 'round';
            // A的轨迹
            if (state.historyA.length > 1) {
                ctx.beginPath();
                ctx.moveTo(state.historyA[0].x, state.historyA[0].y);
                for(let i=1; i<state.historyA.length; i++) ctx.lineTo(state.historyA[i].x, state.historyA[i].y);
                ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
            // B的轨迹
            if (state.historyB.length > 1) {
                ctx.beginPath();
                ctx.moveTo(state.historyB[0].x, state.historyB[0].y);
                for(let i=1; i<state.historyB.length; i++) ctx.lineTo(state.historyB[i].x, state.historyB[i].y);
                ctx.strokeStyle = 'rgba(59, 130, 246, 0.4)';
                ctx.lineWidth = 4;
                ctx.stroke();
            }
        }

        // ==== 等高连线证明机制 ====
        if (ui.showLine.checked && (state.running || state.finished || state.historyA.length > 0)) {
            ctx.beginPath();
            ctx.moveTo(state.xA, state.y);
            // 延长一截，展示高度参照
            ctx.lineTo(Math.max(canvas.width, state.xB + 200), state.y);
            ctx.setLineDash([8, 6]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // ==== 绘制真实小球 ====
        const radius = 10;
        
        // A 球 (重力自由下落)
        ctx.beginPath();
        ctx.arc(state.xA, state.y, radius, 0, Math.PI*2);
        ctx.fillStyle = '#ef4444';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // B 球 (平抛)
        ctx.beginPath();
        ctx.arc(state.xB, state.y, radius, 0, Math.PI*2);
        ctx.fillStyle = '#3b82f6';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 矢量提示（还没发射或发射早期时给出箭头指示）
        if (!state.finished) {
            // 给A球一个向下的重力指示箭头
            drawArrow(ctx, state.xA, state.y + radius + 10, 0, 40, '#f8fafc', 2);
            // 给B球提供真实的抛出初速度矢量箭头
            drawArrow(ctx, state.xB + radius + 5, state.y, state.v0 * 0.4, 0, '#3b82f6', 3);
            drawArrow(ctx, state.xB, state.y + radius + 10, 0, 40, '#f8fafc', 2);
        }
    }

    function animate() {
        if (!state.running) return;

        const now = performance.now();
        const dt = Math.min((now - state.lastRealTime) / 1000.0, 0.05); // 防止切回后台标签时发生大跳步
        state.lastRealTime = now;

        state.t += dt; // 更新总计物理时间，依据物理公式计算绝对坐标更精确
        
        // 核心数学公式验证区：
        // 独立性1：垂直方向均遵循 y = 1/2 gt^2
        const dropDist = 0.5 * g * Math.pow(state.t, 2);
        state.y = startY + dropDist;
        
        // 独立性2：B在水平方向毫无阻碍匀速前进 x = v0 * t
        state.xB = startXb + state.v0 * state.t;

        // 保存拖影记录用的打点器 (可以限制打点频率防爆内存)
        state.historyA.push({x: state.xA, y: state.y});
        state.historyB.push({x: state.xB, y: state.y});

        // 落地碰撞判定 (考虑半径大小的触底)
        if (state.y + 10 >= groundY) {
            state.y = groundY - 10;
            // 修正因为超出碰撞体的时间到确切撞击时刻
            state.t = Math.sqrt(2 * (state.y - startY) / g); 
            state.xB = startXb + state.v0 * state.t;

            state.historyA.push({x: state.xA, y: state.y});
            state.historyB.push({x: state.xB, y: state.y});
            
            state.running = false;
            state.finished = true;
            ui.btnPlay.innerHTML = '↻ 重新塔顶实验';
            ui.btnPlay.style.background = '#64748b'; // 灰色
        }

        updateStatus();
        drawFrame();

        if (state.running) {
            animationId = requestAnimationFrame(animate);
        }
    }

    // 延时加载以正确测绘canvas宽高
    setTimeout(() => {
        resize();
        updateStatus(); // 初始化静态面板数据
    }, 100);

</script>
</body>
</html>

  <style>
    :root{--bg:#07111f;--panel:#101c2d;--line:#26374d;--text:#edf6ff;--muted:#91a4bb;--cyan:#39d5ff;--gold:#ffc857;--pink:#ff6b9e;--green:#55e6a5}
    *{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;display:flex;background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}.controls{width:366px;flex:0 0 auto;padding:20px 22px;background:linear-gradient(180deg,#132238,#0d1828);border-right:1px solid var(--line);overflow:auto;box-shadow:12px 0 35px #0005;z-index:2}h1{font-size:1.34rem;margin:0 0 5px}.lead{margin:0 0 14px;color:var(--muted);font-size:.86rem;line-height:1.5}
    .scene-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;padding:4px;background:#091522;border:1px solid var(--line);border-radius:11px;margin:12px 0}.scene-tabs button{border:0;border-radius:7px;padding:8px 3px;background:transparent;color:#91a4bb;cursor:pointer;font-size:.79rem}.scene-tabs button.active{background:#23415c;color:#fff;box-shadow:0 2px 8px #0005}.formula{padding:10px;margin:10px 0 14px;border:1px solid #2b4a66;border-radius:11px;background:#071421;color:#cceeff;text-align:center;font-family:Cambria,"Times New Roman",serif;font-size:.96rem;line-height:1.65}.formula strong{display:block;color:var(--gold);font-size:1.06rem}.formula small{display:block;color:#8da4ba;font-family:"Segoe UI","Microsoft YaHei",sans-serif;font-size:.74rem}
    .group{margin:11px 0}.group.hidden{display:none}.group label{display:flex;justify-content:space-between;color:var(--muted);font-size:.86rem;margin-bottom:5px}.value{color:var(--cyan);font-variant-numeric:tabular-nums;font-weight:700}input[type=range]{width:100%;accent-color:var(--cyan)}.checks{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:13px 0}.checks label{font-size:.81rem;color:#c7d5e5;display:flex;align-items:center;gap:6px}.buttons{display:grid;grid-template-columns:1.2fr .8fr;gap:8px}.buttons button{border:1px solid #35506d;border-radius:9px;background:#1b3049;color:var(--text);padding:10px 5px;cursor:pointer;font-weight:700}.buttons .primary{background:var(--cyan);color:#05202c;border-color:transparent}.buttons .primary.running{background:var(--gold)}details{margin-top:15px;border-top:1px solid var(--line);padding-top:12px}summary{cursor:pointer;color:var(--gold);font-weight:700;font-size:.9rem}.derivation{color:#b7c6d8;font-size:.81rem;line-height:1.65}.derivation .eq{display:block;color:#eaf6ff;text-align:center;font-family:Cambria,"Times New Roman",serif;margin:7px 0}.note{padding:8px 10px;border-left:3px solid var(--gold);background:#ffc85710;border-radius:0 7px 7px 0}
    .stage{position:relative;flex:1;min-width:0;min-height:0}canvas{display:block;width:100%;height:100%}.home{position:absolute;right:16px;top:14px;color:#b9c9d9;text-decoration:none;background:#0b1726dd;border:1px solid var(--line);border-radius:8px;padding:7px 11px;font-size:.82rem}.readout{position:absolute;left:18px;top:17px;min-width:205px;background:#081522e8;border:1px solid #29445e;border-radius:12px;backdrop-filter:blur(8px);font-size:.81rem;line-height:1.63;color:#adc0d4;box-shadow:0 8px 30px #0004;overflow:hidden;z-index:4;user-select:none}.readout-head{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:7px 7px 6px 12px;background:#13273a;cursor:grab;touch-action:none}.readout-head:active{cursor:grabbing}.readout-title{color:var(--text);font-size:.78rem;font-weight:700;letter-spacing:.04em}.readout-min{all:unset;display:grid;place-items:center;width:25px;height:23px;min-height:0!important;border:1px solid #35516b;border-radius:6px;color:#bdd0e0;background:#1d354c;cursor:pointer;font-size:16px;line-height:1}.readout-min:hover{color:#fff;border-color:var(--cyan)}.readout-body{padding:9px 13px 11px;white-space:nowrap}.readout-body b{color:var(--text)}.readout.collapsed{min-width:150px}.readout.collapsed .readout-body{display:none}.scan-card{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);width:min(390px,calc(100% - 34px));padding:10px 13px;background:#081522e8;border:1px solid #2d4b66;border-radius:11px;pointer-events:none;opacity:0;transition:opacity .2s}.scan-card.show{opacity:1}.scan-row{display:flex;justify-content:space-between;color:#bed0df;font-size:.78rem;margin-bottom:7px}.scan-track{height:5px;background:#23364a;border-radius:5px;overflow:hidden}.scan-fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--gold));box-shadow:0 0 8px var(--cyan)}.legend{position:absolute;right:17px;bottom:14px;display:flex;gap:11px;flex-wrap:wrap;padding:8px 11px;background:#081522cc;border:1px solid var(--line);border-radius:9px;color:#b7c8d9;font-size:.76rem}.swatch{display:inline-block;width:16px;height:3px;margin-right:5px;vertical-align:middle;border-radius:4px}
    @media(max-width:900px){body{height:100dvh}.controls{width:100%;max-height:47dvh;padding:12px 15px}.lead,details{display:none}.scene-tabs{margin:7px 0}.formula{margin:6px 0;padding:6px}.group{margin:7px 0}.stage{min-height:53dvh}.readout{left:9px;top:9px}.legend{display:none}.scan-card{bottom:9px}}
  </style>
    <meta name="description" content="固定初速度、连续改变发射角，观察轨迹族如何形成安全抛物线，并用切点与判别式理解包络线。">
</head>
<body>
  <aside class="controls">
    <h1>抛体运动的安全抛物线</h1>
    <p class="lead">固定初速度大小，逐个生成不同角度的轨迹，观察包络线如何从切点连续形成。</p>
    <nav class="scene-tabs" aria-label="选择抛体场景">
      <button class="active" data-scene="level">水平地面</button><button data-scene="height">从高处抛</button><button data-scene="slope">向斜面抛</button>
    </nav>
    <div class="formula" id="formula"></div>
    <div class="group"><label>初速度 v₀ <span class="value" id="vText"></span></label><input id="v" type="range" min="10" max="40" step="1" value="24"></div>
    <div class="group"><label>重力加速度 g <span class="value" id="gText"></span></label><input id="g" type="range" min="1.6" max="15" step="0.1" value="9.8"></div>
    <div class="group hidden" id="heightGroup"><label>发射高度 h <span class="value" id="hText"></span></label><input id="height" type="range" min="2" max="30" step="1" value="12"></div>
    <div class="group hidden" id="slopeGroup"><label>斜面倾角 β <span class="value" id="bText"></span></label><input id="slope" type="range" min="5" max="35" step="1" value="18"></div>
    <div class="group"><label>当前发射角 θ <span class="value" id="aText"></span></label><input id="angle" type="range" min="5" max="85" step="0.5" value="60"></div>
    <div class="group"><label>轨迹族密度 <span class="value" id="nText"></span></label><input id="count" type="range" min="9" max="41" step="2" value="21"></div>
    <div class="checks"><label><input id="showFamily" type="checkbox" checked>显示轨迹族</label><label><input id="showEnvelope" type="checkbox" checked>显示包络线</label><label><input id="showContact" type="checkbox" checked>显示切点</label><label><input id="showExtensions" type="checkbox">显示落点后延长线</label></div>
    <div class="buttons"><button class="primary" id="sweep">▶ 生成轨迹族</button><button id="launch">● 发射小球</button></div>
    <details open><summary>公式与边界</summary><div class="derivation">
      <p>发射点高度为 h₀ 时，消去时间可得：</p><span class="eq">y=h₀+x tanθ−gx²(1+tan²θ)/(2v₀²)</span><p>令 u=tanθ，把它看成关于 u 的二次方程。包络线上只有一个发射角，故判别式 Δ=0：</p><span class="eq">y<sub>env</sub>=h₀+v₀²/(2g)−gx²/(2v₀²)</span><p id="sceneNote" class="note"></p>
    </div></details>
  </aside>
  <main class="stage" id="stage">
    <canvas id="canvas" aria-label="水平地面、高处抛出和斜面三种场景的抛体轨迹族及包络线演示"></canvas>
    <a class="home" href="/">⌂ 返回展厅</a><div class="readout" id="readout"><div class="readout-head" id="readoutDrag"><span class="readout-title">运动数据</span><button class="readout-min" id="readoutMin" type="button" title="最小化运动数据" aria-label="最小化运动数据" aria-expanded="true">−</button></div><div class="readout-body" id="readoutBody"></div></div>
    <div class="scan-card" id="scanCard"><div class="scan-row"><span id="scanLabel">正在生成轨迹族</span><span id="scanPercent">0%</span></div><div class="scan-track"><div class="scan-fill" id="scanFill"></div></div></div>
    <div class="legend"><span><i class="swatch" style="background:#39d5ff"></i>当前轨迹</span><span><i class="swatch" style="background:#7899b7"></i>已生成轨迹</span><span><i class="swatch" style="background:#ffc857"></i>包络线</span><span><i class="swatch" style="background:#ff6b9e"></i>切点</span></div>
  </main>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),stage=$('stage');
const ui={v:$('v'),g:$('g'),h:$('height'),slope:$('slope'),angle:$('angle'),count:$('count'),family:$('showFamily'),envelope:$('showEnvelope'),contact:$('showContact'),extensions:$('showExtensions'),sweep:$('sweep'),launch:$('launch')};
let scene='level',scan={state:'idle',progress:1},ball={on:false,t:0},last=performance.now(),dpr=1,W=0,H=0;
let animation=null;
const rad=d=>d*Math.PI/180,deg=r=>r*180/Math.PI,clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function params(){const beta=rad(+ui.slope.value),h0=scene==='height'?+ui.h.value:0,minA=scene==='slope'?+ui.slope.value+2:5;return{v:+ui.v.value,g:+ui.g.value,h0,beta,a:rad(+ui.angle.value),n:+ui.count.value,minA,maxA:85}}
function impact(p,a){const{v,g,h0,beta}=p;if(scene==='slope'){const t=2*v*Math.sin(a-beta)/(g*Math.cos(beta));return{t:Math.max(0,t),x:Math.max(0,v*Math.cos(a)*t)}}const t=(v*Math.sin(a)+Math.sqrt(v*v*Math.sin(a)**2+2*g*h0))/g;return{t,x:v*Math.cos(a)*t}}
function trajectory(p,a,x){return p.h0+x*Math.tan(a)-p.g*x*x/(2*p.v*p.v*Math.cos(a)**2)}
function envelope(p,x){return p.h0+p.v*p.v/(2*p.g)-p.g*x*x/(2*p.v*p.v)}
function boundaryY(p,x){return scene==='slope'?x*Math.tan(p.beta):0}
function envelopeEnd(p){if(scene==='slope')return p.v*p.v/p.g*(1/Math.cos(p.beta)-Math.tan(p.beta));return p.v/p.g*Math.sqrt(p.v*p.v+2*p.g*p.h0)}
function mapSetup(p){const end=envelopeEnd(p),yTop=p.h0+p.v*p.v/(2*p.g),planeTop=boundaryY(p,end),left=58,right=30,top=38,bottom=51,s=Math.max(.1,Math.min((W-left-right)/(end*1.11),(H-top-bottom)/(Math.max(yTop,planeTop)*1.2||1)));return{ox:left,oy:H-bottom,s,end,yTop}}
function xy(M,x,y){return[M.ox+x*M.s,M.oy-y*M.s]}
function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
function pathFn(M,fn,x0,x1,color,width,dash=[]){if(!(x1>x0))return;ctx.beginPath();for(let i=0;i<=180;i++){const x=x0+(x1-x0)*i/180,[X,Y]=xy(M,x,fn(x));i?ctx.lineTo(X,Y):ctx.moveTo(X,Y)}ctx.setLineDash(dash);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([])}
function dot(x,y,r,color){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=1.4;ctx.stroke()}
function drawArrow(x,y,a,len,color){const X=x+Math.cos(a)*len,Y=y-Math.sin(a)*len;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.stroke();ctx.beginPath();ctx.moveTo(X,Y);ctx.lineTo(X-9*Math.cos(a-.42),Y+9*Math.sin(a-.42));ctx.lineTo(X-9*Math.cos(a+.42),Y+9*Math.sin(a+.42));ctx.fillStyle=color;ctx.fill()}
function grid(M,p){ctx.fillStyle='#07111f';ctx.fillRect(0,0,W,H);const step=M.end>100?20:M.end>45?10:5;ctx.font='11px Segoe UI';ctx.fillStyle='#71869d';ctx.strokeStyle='#17273a';ctx.lineWidth=1;ctx.textAlign='center';for(let x=0;x<=M.end*1.06;x+=step){const[X]=xy(M,x,0);ctx.beginPath();ctx.moveTo(X,25);ctx.lineTo(X,M.oy+5);ctx.stroke();ctx.fillText(x.toFixed(0),X,M.oy+20)}const ys=M.yTop>40?10:5;ctx.textAlign='right';for(let y=0;y<=M.yTop*1.12;y+=ys){const[,Y]=xy(M,0,y);ctx.beginPath();ctx.moveTo(M.ox,Y);ctx.lineTo(W-18,Y);ctx.stroke();ctx.fillText(y.toFixed(0),M.ox-7,Y+4)}ctx.strokeStyle='#7990a8';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(M.ox,23);ctx.lineTo(M.ox,M.oy);ctx.lineTo(W-18,M.oy);ctx.stroke();ctx.fillStyle='#91a4bb';ctx.textAlign='right';ctx.fillText('x / m',W-20,M.oy+35);ctx.save();ctx.translate(17,34);ctx.rotate(-Math.PI/2);ctx.fillText('y / m',0,0);ctx.restore();drawSurface(M,p)}
function drawSurface(M,p){ctx.save();if(scene==='slope'){const[X0,Y0]=xy(M,0,0),[X1,Y1]=xy(M,M.end*1.1,boundaryY(p,M.end*1.1));ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y1);ctx.lineTo(X1,M.oy+60);ctx.lineTo(X0,M.oy+60);ctx.closePath();ctx.fillStyle='#17283a';ctx.fill();ctx.beginPath();ctx.moveTo(X0,Y0);ctx.lineTo(X1,Y1);ctx.strokeStyle='#8fa2b5';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#b9c7d4';ctx.textAlign='left';ctx.fillText(`斜面 β=${deg(p.beta).toFixed(0)}°`,X0+70,Y0-36)}else{const[,Y]=xy(M,0,0);ctx.fillStyle='#17283a';ctx.fillRect(M.ox,Y,W-M.ox,H-Y);ctx.strokeStyle='#8fa2b5';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(M.ox,Y);ctx.lineTo(W,Y);ctx.stroke();if(scene==='height'){const[X0,Y0]=xy(M,0,0),[,Yh]=xy(M,0,p.h0);ctx.strokeStyle='#55e6a5aa';ctx.setLineDash([5,4]);ctx.beginPath();ctx.moveTo(X0+10,Y0);ctx.lineTo(X0+10,Yh);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#72e8b2';ctx.textAlign='left';ctx.fillText(`h=${p.h0.toFixed(0)} m`,X0+17,(Y0+Yh)/2)}}ctx.restore()}
function angleArc(M,p){const[X,Y]=xy(M,0,p.h0),r=28;ctx.beginPath();ctx.arc(X,Y,r,-p.a,0);ctx.strokeStyle='#39d5ff99';ctx.lineWidth=1.5;ctx.stroke();ctx.fillStyle='#85e8ff';ctx.font='12px Segoe UI';ctx.textAlign='left';ctx.fillText('θ',X+r+3,Y-9);drawArrow(X,Y,p.a,51,'#39d5ff')}
function draw(){const p=params(),M=mapSetup(p);grid(M,p);const shown=scan.state==='idle'||scan.state==='done'?1:scan.progress,currentDeg=p.minA+(p.maxA-p.minA)*shown;if(ui.family.checked){for(let i=0;i<p.n;i++){const q=i/(p.n-1),ad=p.minA+(p.maxA-p.minA)*q;if(q>shown+.0001)continue;const a=rad(ad),hit=impact(p,a);pathFn(M,x=>trajectory(p,a,x),0,hit.x,'rgba(112,154,193,.28)',1.15)}}const hit=impact(p,p.a);pathFn(M,x=>trajectory(p,p.a,x),0,hit.x,'#39d5ff',3);if(ui.extensions.checked){const xt=p.v*p.v/(p.g*Math.tan(p.a)),end=Math.min(M.end*1.08,Math.max(hit.x,xt*1.05));pathFn(M,x=>trajectory(p,p.a,x),hit.x,end,'#39d5ff88',1.5,[6,5])}if(ui.envelope.checked){let x0=0;if(scan.state==='running'||scan.state==='paused'){const at=rad(currentDeg),xt=p.v*p.v/(p.g*Math.tan(at));x0=xt<=M.end?xt:M.end}pathFn(M,x=>envelope(p,x),x0,M.end,'#ffc857',3.5)}const xt=p.v*p.v/(p.g*Math.tan(p.a)),yt=trajectory(p,p.a,xt),visible=yt>=boundaryY(p,xt)-1e-7;if(ui.contact.checked&&(visible||ui.extensions.checked)){const[X,Y]=xy(M,xt,yt);dot(X,Y,5,'#ff6b9e');ctx.fillStyle='#ff9dbd';ctx.font='12px Segoe UI';ctx.textAlign='left';ctx.fillText(visible?'切点':'延长线切点',X+9,Y-8)}angleArc(M,p);if(ball.on){const t=Math.min(ball.t,hit.t),x=p.v*Math.cos(p.a)*t,y=p.h0+p.v*Math.sin(p.a)*t-p.g*t*t/2,[X,Y]=xy(M,x,y);dot(X,Y,6,'#55e6a5');if(t>=hit.t)ball.on=false}updateUI(p,M,hit,visible,shown)}
function updateUI(p,M,hit,visible,shown){$('vText').textContent=p.v.toFixed(1)+' m/s';$('gText').textContent=p.g.toFixed(1)+' m/s²';$('hText').textContent=p.h0.toFixed(0)+' m';$('bText').textContent=deg(p.beta).toFixed(0)+'°';$('aText').textContent=deg(p.a).toFixed(1)+'°';$('nText').textContent=p.n+' 条';const sceneName={level:'水平地面',height:'从高处抛出',slope:'向斜面抛'}[scene],dist=scene==='slope'?hit.x/Math.cos(p.beta):hit.x;$('readoutBody').innerHTML=`<b>${sceneName} · θ=${deg(p.a).toFixed(1)}°</b><br>包络线边界：x=${M.end.toFixed(1)} m<br>${scene==='slope'?'沿斜面距离':'水平射程'}：${dist.toFixed(1)} m<br>飞行时间：${hit.t.toFixed(2)} s<br>${visible?'切点位于实际轨迹上':'切点位于落点后的延长线上'}`;const percent=Math.round(shown*100);$('scanFill').style.width=percent+'%';$('scanPercent').textContent=percent+'%';$('scanCard').classList.toggle('show',scan.state!=='idle');$('scanLabel').textContent=scan.state==='done'?'轨迹族生成完成':'正在按角度逐条生成轨迹'}
function updateSceneText(){const p=params();$('heightGroup').classList.toggle('hidden',scene!=='height');$('slopeGroup').classList.toggle('hidden',scene!=='slope');if(+ui.angle.value<p.minA)ui.angle.value=p.minA;ui.angle.min=p.minA;const formulas={level:'轨迹：y=x tanθ−gx²/(2v₀²cos²θ)<strong>包络线：y=v₀²/(2g)−gx²/(2v₀²)</strong><small>与地面 y=0 相交处为最远可达边界</small>',height:'轨迹：y=h+x tanθ−gx²/(2v₀²cos²θ)<strong>包络线：y=h+v₀²/(2g)−gx²/(2v₀²)</strong><small>最大水平边界 x=(v₀/g)√(v₀²+2gh)</small>',slope:'轨迹：y=x tanθ−gx²/(2v₀²cos²θ)<strong>包络线：y=v₀²/(2g)−gx²/(2v₀²)</strong><small>斜面 y=x tanβ；θ 必须大于 β</small>'};$('formula').innerHTML=formulas[scene];const notes={level:'地面以上的包络段由 θ≥45° 的轨迹相切形成。低角度轨迹的切点在落地后的延长线上。',height:'地面下降到发射点下方 h 处，包络线整体相对地面升高 h；其与 y=0 的交点给出最大水平可达距离。',slope:'轨迹在 y=x tanβ 处结束。实际轨迹上的包络切点要求 θ≥45°+β/2；最佳斜面射程也对应这个角度。'};$('sceneNote').textContent=notes[scene];resetScan();draw()}
function resetScan(){scan={state:'idle',progress:1};ui.sweep.textContent='▶ 生成轨迹族';ui.sweep.classList.remove('running')}
document.querySelectorAll('[data-scene]').forEach(btn=>btn.onclick=()=>{scene=btn.dataset.scene;document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b===btn));ball.on=false;updateSceneText()});
Object.values(ui).forEach(el=>{if(el instanceof HTMLInputElement)el.addEventListener('input',()=>{ball.on=false;if(el===ui.slope&&scene==='slope')updateSceneText();else{if(['range'].includes(el.type)&&![ui.angle].includes(el))resetScan();draw()}})});
ui.sweep.onclick=()=>{if(scan.state==='running'){scan.state='paused';ui.sweep.textContent='▶ 继续生成';ui.sweep.classList.remove('running')}else{if(scan.state==='idle'||scan.state==='done')scan.progress=0;scan.state='running';ball.on=false;ui.sweep.textContent='❚❚ 暂停生成';ui.sweep.classList.add('running')}animation?.start()};ui.launch.onclick=()=>{ball={on:true,t:0};animation?.start()};
const readout=$('readout'),readoutMin=$('readoutMin'),readoutDrag=$('readoutDrag');
function keepReadoutInStage(){const r=readout.getBoundingClientRect(),s=stage.getBoundingClientRect(),left=clamp(r.left-s.left,0,Math.max(0,s.width-r.width)),top=clamp(r.top-s.top,0,Math.max(0,s.height-r.height));readout.style.left=left+'px';readout.style.top=top+'px'}
readoutMin.onclick=e=>{e.stopPropagation();const collapsed=readout.classList.toggle('collapsed');readoutMin.textContent=collapsed?'+':'−';readoutMin.title=collapsed?'展开运动数据':'最小化运动数据';readoutMin.setAttribute('aria-label',readoutMin.title);readoutMin.setAttribute('aria-expanded',String(!collapsed));requestAnimationFrame(keepReadoutInStage)};
readoutDrag.addEventListener('pointerdown',e=>{if(e.target===readoutMin)return;e.preventDefault();const box=readout.getBoundingClientRect(),area=stage.getBoundingClientRect(),dx=e.clientX-box.left,dy=e.clientY-box.top;readoutDrag.setPointerCapture(e.pointerId);const move=ev=>{const left=clamp(ev.clientX-area.left-dx,0,Math.max(0,area.width-readout.offsetWidth)),top=clamp(ev.clientY-area.top-dy,0,Math.max(0,area.height-readout.offsetHeight));readout.style.left=left+'px';readout.style.top=top+'px'};const stop=()=>{readoutDrag.removeEventListener('pointermove',move);readoutDrag.removeEventListener('pointerup',stop);readoutDrag.removeEventListener('pointercancel',stop)};readoutDrag.addEventListener('pointermove',move);readoutDrag.addEventListener('pointerup',stop);readoutDrag.addEventListener('pointercancel',stop)});
function advance(dt){if(scan.state==='running'){scan.progress=Math.min(1,scan.progress+dt/5.2);const p=params();ui.angle.value=p.minA+(p.maxA-p.minA)*scan.progress;if(scan.progress>=1){scan.state='done';ui.sweep.textContent='↻ 重播生成';ui.sweep.classList.remove('running')}}if(ball.on)ball.t+=dt}
animation=PhysicsLab.createAnimation({update:advance,render:draw,isActive:()=>scan.state==='running'||ball.on});
window.addEventListener('resize',()=>{resize();keepReadoutInStage()});updateSceneText();resize();animation.start();
</script>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#061522">
  <meta name="description" content="交互演示地球南北半球的科里奥利偏转，以及小球在旋转圆盘上的双参考系轨迹。">
  <title>科里奥利效应：地球与旋转圆盘</title>
  <link rel="stylesheet" href="/lab-common.css">
  <script src="/lab-runtime.js"></script>
  <style>
    :root{--bg:#061522;--panel:#0d2032;--line:#26435a;--text:#effaff;--muted:#91adbd;--north:#ff657a;--south:#41a7ff;--cyan:#53e0df;--gold:#ffd166;--purple:#b58cff}
    *{box-sizing:border-box}
    body{margin:0;height:100vh;overflow:hidden;display:flex;background:radial-gradient(circle at 70% 30%,#12324a 0,#061522 52%);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
    .controls{width:380px;flex:0 0 auto;padding:18px 20px;background:linear-gradient(180deg,#10283b,#091927);border-right:1px solid var(--line);overflow:auto;box-shadow:12px 0 34px #0007;z-index:3}
    h1{font-size:1.35rem;margin:0 0 5px}.lead{font-size:.84rem;line-height:1.55;color:var(--muted);margin:0 0 11px}
    .mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:#071725;border:1px solid var(--line);border-radius:11px;margin-bottom:11px}.mode-tabs button{border:0;border-radius:7px;background:transparent;color:#91adbd;padding:9px 5px;cursor:pointer;font:inherit}.mode-tabs button.active{background:#24516b;color:#fff;font-weight:750;box-shadow:0 3px 12px #0005}
    .formula{padding:10px 12px;border:1px solid #2d526d;border-radius:10px;background:#071725;text-align:center;font-family:Cambria,"Times New Roman",serif;color:#dff8ff;font-size:1.05rem}.formula small{display:block;margin-top:4px;font-family:"Microsoft YaHei",sans-serif;color:#8eabba;font-size:.74rem}
    .panel.hidden{display:none}.group{margin:11px 0}.group label{display:flex;justify-content:space-between;gap:8px;margin-bottom:5px;color:#a8bdca;font-size:.83rem}.value{color:#fff;font-weight:700;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--cyan)}
    .choice,.hemispheres{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:11px 0}.choice button,.hemispheres button,.buttons button,.presets button{border:1px solid #31516a;border-radius:8px;background:#142c40;color:#cfe1eb;padding:9px 5px;cursor:pointer;font:inherit}.hemispheres button.active[data-lat="45"]{background:var(--north);border-color:transparent;color:#270811;font-weight:700}.hemispheres button.active[data-lat="-45"]{background:var(--south);border-color:transparent;color:#031a2d;font-weight:700}.choice button.active{background:var(--cyan);border-color:transparent;color:#06262b;font-weight:750}.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.presets button{font-size:.76rem;padding:7px 2px}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.buttons button.primary{background:var(--cyan);color:#042328;border-color:transparent;font-weight:750}.buttons button.warn{background:#432b35;border-color:#754253}.readout{margin-top:12px;padding:10px 12px;background:#071725;border:1px solid var(--line);border-radius:10px;font-size:.79rem;line-height:1.7;color:#b9cbd5}.readout b{color:#fff}.rule{margin-top:12px;padding-top:11px;border-top:1px solid var(--line);color:#a5bac6;font-size:.79rem;line-height:1.65}.rule strong{color:var(--gold)}
    .stage{position:relative;flex:1;min-width:0;min-height:0}canvas{display:block;width:100%;height:100%;touch-action:none}.home{position:absolute;right:15px;top:14px;padding:7px 11px;color:#c6d8e2;text-decoration:none;background:#061522dc;border:1px solid var(--line);border-radius:8px;font-size:.8rem}.legend{position:absolute;left:15px;top:14px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#061522dc;backdrop-filter:blur(8px);font-size:.75rem;line-height:1.7;color:#b8ccd7;pointer-events:none}.legend span{display:inline-block;width:20px;height:3px;border-radius:3px;margin-right:6px;vertical-align:middle}.legend .ideal{background:repeating-linear-gradient(90deg,#9dafb9 0 5px,transparent 5px 8px)}.legend .trail{background:var(--cyan)}.legend .force{background:var(--gold)}.badge{position:absolute;right:15px;bottom:14px;max-width:310px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:#061522dc;color:#a9c0cc;font-size:.74rem;line-height:1.55;pointer-events:none}
    @media(max-width:900px){.controls{width:100%;max-height:46dvh;padding:12px 15px}.lead,.rule{display:none}.group{margin:7px 0}.stage{min-height:54dvh}.legend{left:8px;top:8px;padding:7px 9px}.home{right:8px;top:8px}.badge{display:none}.formula{padding:7px 9px}}
  </style>
</head>
<body>
  <aside class="controls">
    <h1>科里奥利效应 · Coriolis</h1>
    <p class="lead">先在地球局部水平面观察南北半球偏转，再用旋转圆盘比较地面惯性系与随盘旋转系中的同一条运动。</p>
    <nav class="mode-tabs" aria-label="选择演示模式"><button class="active" data-mode="earth">地球南北半球</button><button data-mode="disk">旋转圆盘实验</button></nav>
    <div class="formula" id="formula">F<sub>C</sub> = −2m Ω × v<small>水平分量：a<sub>x</sub> = fv<sub>y</sub>，a<sub>y</sub> = −fv<sub>x</sub></small></div>
    <section class="panel" id="earthControls">
      <div class="hemispheres"><button data-lat="45" class="active">北半球 · 右偏</button><button data-lat="-45">南半球 · 左偏</button></div>
      <div class="group"><label>纬度 φ <span class="value" id="latitudeText">45°N</span></label><input id="latitude" type="range" min="-80" max="80" step="1" value="45"></div>
      <div class="group"><label>初速度 <span class="value" id="speedText">200 m/s</span></label><input id="speed" type="range" min="50" max="400" step="10" value="200"></div>
      <div class="group"><label>运动方向（从正东逆时针）<span class="value" id="angleText">90° · 北</span></label><input id="angle" type="range" min="0" max="359" step="1" value="90"></div>
      <div class="presets"><button data-angle="0">向东</button><button data-angle="90">向北</button><button data-angle="180">向西</button><button data-angle="270">向南</button></div>
      <div class="group"><label>轨迹演示倍率 <span class="value" id="scaleText">×1</span></label><input id="effectScale" type="range" min="1" max="240" step="1" value="1"></div>
    </section>
    <section class="panel hidden" id="diskControls">
      <div class="choice"><button class="active" data-spin="1">↺ 逆时针旋转</button><button data-spin="-1">↻ 顺时针旋转</button></div>
      <div class="group"><label>圆盘转速 <span class="value" id="rpmText">8 rpm</span></label><input id="rpm" type="range" min="1" max="20" step="1" value="8"></div>
      <div class="group"><label>小球相对圆盘的发射速度 <span class="value" id="ballSpeedText">0.8 m/s</span></label><input id="ballSpeed" type="range" min="0.2" max="1.8" step="0.1" value="0.8"></div>
      <div class="rule"><strong>实验设置：</strong>半径 1.5 m 的无摩擦圆盘。小球从左侧沿半径瞄准圆心发射；释放后不再受圆盘推力。</div>
    </section>
    <div class="buttons"><button class="primary" id="play">❚❚ 暂停</button><button class="warn" id="reset">↺ 重新发射</button></div>
    <div class="readout" id="readout"></div>
    <div class="rule" id="mainRule"><strong>方向速记：</strong>顺着物体运动方向看，北半球向右偏、南半球向左偏；赤道处水平偏转约为零。科里奥利力始终垂直于速度，理想情况下只改变方向，不改变速率。</div>
  </aside>
  <main class="stage" id="stage">
    <canvas id="canvas" tabindex="0" aria-label="地球与旋转圆盘上的科里奥利效应动态演示"></canvas>
    <a class="home" href="/">⌂ 返回展厅</a>
    <div class="legend" id="legend"><div><span class="ideal"></span>无自转参考路径</div><div><span class="trail"></span>旋转地球上的轨迹</div><div><span class="force"></span>科里奥利加速度方向</div></div>
    <div class="badge" id="badge">局部水平面：右为东，上为北。演示倍率只放大轨迹弯曲，读数仍显示真实地球数值。</div>
  </main>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),stage=$('stage');
const ui={lat:$('latitude'),speed:$('speed'),angle:$('angle'),scale:$('effectScale'),rpm:$('rpm'),ballSpeed:$('ballSpeed'),play:$('play'),reset:$('reset')};
const EARTH_OMEGA=7.292115e-5,DISK_RADIUS=1.5,dirs=['东','东北','北','西北','西','西南','南','东南'];
let W=0,H=0,dpr=1,mode='earth',running=true,last=performance.now(),spinDirection=1;
let animation=null;
let earth={elapsed:0,particle:null,trail:[]},disk={t:0,angle:0,r0:null,vI:null,pI:null,pR:null,trailI:[],trailR:[],previewI:[],previewR:[],exited:false};
const earthState=()=>{const lat=+ui.lat.value,phi=lat*Math.PI/180,speed=+ui.speed.value,angle=+ui.angle.value*Math.PI/180,f=2*EARTH_OMEGA*Math.sin(phi);return{lat,phi,speed,angle,f,amp:+ui.scale.value}};
const diskState=()=>{const rpm=+ui.rpm.value,omega=spinDirection*rpm*2*Math.PI/60,speed=+ui.ballSpeed.value;return{rpm,omega,speed}};
const rotate=(p,a)=>({x:p.x*Math.cos(a)-p.y*Math.sin(a),y:p.x*Math.sin(a)+p.y*Math.cos(a)});
function directionName(deg){return dirs[Math.round(((deg%360)+360)%360/45)%8]}
function resetEarth(){const s=earthState();earth={elapsed:0,particle:{x:0,y:0,vx:s.speed*Math.cos(s.angle),vy:s.speed*Math.sin(s.angle)},trail:[{x:0,y:0}]}}
function resetDisk(){const s=diskState(),r0={x:-DISK_RADIUS*.78,y:0},platformV={x:-s.omega*r0.y,y:s.omega*r0.x},vI={x:s.speed+platformV.x,y:platformV.y},previewI=[],previewR=[];for(let t=0;t<=12;t+=.025){const pI={x:r0.x+vI.x*t,y:r0.y+vI.y*t};if(Math.hypot(pI.x,pI.y)>DISK_RADIUS*1.04)break;previewI.push(pI);previewR.push(rotate(pI,-s.omega*t))}disk={t:0,angle:0,r0,vI,pI:{...r0},pR:{...r0},trailI:[{...r0}],trailR:[{...r0}],previewI,previewR,exited:false}}
function resetCurrent(){mode==='earth'?resetEarth():resetDisk();running=true;updateButtons();updateUI()}
function setMode(next){mode=next;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('earthControls').classList.toggle('hidden',mode!=='earth');$('diskControls').classList.toggle('hidden',mode!=='disk');$('mainRule').innerHTML=mode==='earth'?'<strong>方向速记：</strong>顺着物体运动方向看，北半球向右偏、南半球向左偏；赤道处水平偏转约为零。科里奥利力始终垂直于速度，理想情况下只改变方向，不改变速率。':'<strong>观察关键：</strong>释放后，小球在地面惯性系中沿直线前进；同一运动在随盘旋转的坐标中表现为弯曲。完整旋转系描述还包含离心惯性力。';$('formula').innerHTML=mode==='earth'?'F<sub>C</sub> = −2m Ω × v<small>水平分量：a<sub>x</sub> = fv<sub>y</sub>，a<sub>y</sub> = −fv<sub>x</sub></small>':'a<sub>C</sub> = −2 Ω × v′<small>左：地面惯性系　·　右：随圆盘旋转系</small>';$('legend').innerHTML=mode==='earth'?'<div><span class="ideal"></span>无自转参考路径</div><div><span class="trail"></span>旋转地球上的轨迹</div><div><span class="force"></span>科里奥利加速度方向</div>':'<div><span class="trail"></span>同一颗小球的轨迹</div><div><span class="ideal"></span>发射时瞄准圆心</div><div><span class="force"></span>旋转系中的 aC</div>';$('badge').textContent=mode==='earth'?'局部水平面：右为东，上为北。演示倍率只放大轨迹弯曲，读数仍显示真实地球数值。':'两个画面严格同步：左边圆盘在转、小球走直线；右边坐标随盘转、小球轨迹看起来弯曲。';resetCurrent()}
function updateUI(){if(mode==='earth'){const s=earthState(),a=Math.abs(s.f*s.speed),side=s.lat>0?'右侧':s.lat<0?'左侧':'无水平偏转';$('latitudeText').textContent=s.lat===0?'0° · 赤道':`${Math.abs(s.lat)}°${s.lat>0?'N':'S'}`;$('speedText').textContent=`${s.speed} m/s`;$('angleText').textContent=`${Math.round(s.angle*180/Math.PI)}° · ${directionName(s.angle*180/Math.PI)}`;$('scaleText').textContent=`×${s.amp}`;$('readout').innerHTML=`科里奥利参数 <b>f = ${s.f.toExponential(3)} s⁻¹</b><br>真实加速度 <b>a = ${a.toFixed(4)} m/s²</b><br>当前结论：<b>${s.lat>0?'北半球':s.lat<0?'南半球':'赤道'}，向运动方向${side}</b><br>已演示 <b>${earth.elapsed.toFixed(1)} h</b>`;document.querySelectorAll('[data-lat]').forEach(b=>b.classList.toggle('active',+b.dataset.lat===s.lat))}else{const s=diskState(),ac=2*Math.abs(s.omega)*s.speed,side=s.omega>0?'运动方向右侧':'运动方向左侧';$('rpmText').textContent=`${s.rpm} rpm`;$('ballSpeedText').textContent=`${s.speed.toFixed(1)} m/s`;$('readout').innerHTML=`圆盘角速度 <b>Ω = ${s.omega.toFixed(3)} rad/s</b><br>发射瞬间科里奥利加速度 <b>a<sub>C</sub> = ${ac.toFixed(2)} m/s²</b><br>旋转系初始偏转：<b>${side}</b><br>状态：<b>${disk.exited?'小球已离开圆盘':`运动 ${disk.t.toFixed(2)} s`}</b>`;document.querySelectorAll('[data-spin]').forEach(b=>b.classList.toggle('active',+b.dataset.spin===spinDirection))}}
function updateButtons(){ui.play.textContent=running?'❚❚ 暂停':(mode==='disk'&&disk.exited?'▶ 再次发射':'▶ 继续');animation?.start()}
function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function arrow(x1,y1,x2,y2,color,width=3,label=''){const a=Math.atan2(y2-y1,x2-x1),head=10;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke();ctx.beginPath();ctx.moveTo(x2,y2);ctx.lineTo(x2-head*Math.cos(a-.45),y2-head*Math.sin(a-.45));ctx.lineTo(x2-head*Math.cos(a+.45),y2-head*Math.sin(a+.45));ctx.fillStyle=color;ctx.fill();if(label){ctx.font='700 12px Segoe UI,Microsoft YaHei';ctx.fillText(label,x2+7,y2-7)}}
function drawGlobe(cx,cy,r,s){const g=ctx.createRadialGradient(cx-r*.3,cy-r*.35,r*.1,cx,cy,r);g.addColorStop(0,'#2f9cc0');g.addColorStop(.65,'#176387');g.addColorStop(1,'#092f4c');ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();ctx.strokeStyle='#8adceb33';ctx.lineWidth=1;for(let i=-3;i<=3;i++){const yy=cy+i*r/4;ctx.beginPath();ctx.ellipse(cx,yy,Math.sqrt(Math.max(0,r*r-(yy-cy)**2)),r*.07,0,0,Math.PI*2);ctx.stroke()}ctx.strokeStyle='#52c79755';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(cx-r*.42,cy-r*.7);ctx.bezierCurveTo(cx-r*.7,cy-r*.3,cx-r*.18,cy-r*.1,cx-r*.35,cy+r*.58);ctx.stroke();ctx.beginPath();ctx.moveTo(cx+r*.55,cy-r*.55);ctx.bezierCurveTo(cx+r*.25,cy-r*.15,cx+r*.66,cy+r*.05,cx+r*.32,cy+r*.48);ctx.stroke();ctx.restore();ctx.strokeStyle='#85d9ee';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.strokeStyle='#ccebf080';ctx.beginPath();ctx.ellipse(cx,cy,r,r*.08,0,0,Math.PI*2);ctx.stroke();const py=cy-s.lat/90*r*.82;ctx.strokeStyle=s.lat>=0?'#ff657a':'#41a7ff';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(cx,py,Math.sqrt(Math.max(5,r*r-(py-cy)**2)),r*.05,0,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#dff7ff';ctx.font='12px Segoe UI,Microsoft YaHei';ctx.fillText(s.lat===0?'赤道':`${Math.abs(s.lat)}°${s.lat>0?'N':'S'}`,cx+r+9,py+4);ctx.beginPath();ctx.arc(cx,cy-r-18,r*.72,Math.PI*.95,Math.PI*1.86);ctx.strokeStyle='#53e0df';ctx.lineWidth=3;ctx.stroke();arrow(cx+r*.65,cy-r-40,cx+r*.82,cy-r-35,'#53e0df',3,'自西向东')}
function drawEarth(){const s=earthState(),wide=W>760,globeR=Math.min(wide?W*.17:W*.14,H*.2),gx=W*.78,gy=wide?H*.26:H*.22;drawGlobe(gx,gy,globeR,s);const box={x:Math.max(28,W*.08),y:wide?H*.18:H*.37,w:wide?W*.57:W*.84,h:wide?H*.68:H*.52};roundedRect(box.x,box.y,box.w,box.h,18);ctx.fillStyle='#071725b8';ctx.fill();ctx.strokeStyle='#294b61';ctx.lineWidth=1.5;ctx.stroke();const ox=box.x+box.w*.5,oy=box.y+box.h*.56,meters=Math.max(1,...earth.trail.map(p=>Math.hypot(p.x,p.y)),s.speed*earth.elapsed*3600),plotR=Math.min(box.w,box.h)*.4,pxPerM=plotR/(meters*1.08);ctx.strokeStyle='#244155';ctx.lineWidth=1;ctx.setLineDash([3,6]);for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(box.x+12,oy+i*box.h/8);ctx.lineTo(box.x+box.w-12,oy+i*box.h/8);ctx.stroke();ctx.beginPath();ctx.moveTo(ox+i*box.w/8,box.y+12);ctx.lineTo(ox+i*box.w/8,box.y+box.h-12);ctx.stroke()}ctx.setLineDash([]);arrow(box.x+24,box.y+box.h-26,box.x+74,box.y+box.h-26,'#8fb0c1',2,'东');arrow(box.x+24,box.y+box.h-26,box.x+24,box.y+box.h-76,'#8fb0c1',2,'北');const idealX=s.speed*Math.cos(s.angle)*earth.elapsed*3600,idealY=s.speed*Math.sin(s.angle)*earth.elapsed*3600;ctx.setLineDash([8,7]);ctx.beginPath();ctx.moveTo(ox,oy);ctx.lineTo(ox+idealX*pxPerM,oy-idealY*pxPerM);ctx.strokeStyle='#b5c1c788';ctx.lineWidth=2;ctx.stroke();ctx.setLineDash([]);if(earth.trail.length>1){ctx.beginPath();earth.trail.forEach((p,i)=>{const x=ox+p.x*pxPerM,y=oy-p.y*pxPerM;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle=s.lat>0?'#ff657a':s.lat<0?'#41a7ff':'#53e0df';ctx.lineWidth=4;ctx.lineJoin='round';ctx.stroke()}const p=earth.particle,px=ox+p.x*pxPerM,py=oy-p.y*pxPerM;ctx.beginPath();ctx.arc(px,py,7,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowColor=s.lat>=0?'#ff657a':'#41a7ff';ctx.shadowBlur=15;ctx.fill();ctx.shadowBlur=0;const vmag=Math.hypot(p.vx,p.vy)||1,vis=42,ax=s.f*p.vy,ay=-s.f*p.vx,amag=Math.hypot(ax,ay);arrow(px,py,px+p.vx/vmag*vis,py-p.vy/vmag*vis,'#eefaff',2,'v');if(amag>1e-12)arrow(px,py,px+ax/amag*vis,py-ay/amag*vis,'#ffd166',3,'aC');ctx.fillStyle=s.lat>0?'#ff9aaa':s.lat<0?'#7cc4ff':'#68e7e3';ctx.font='700 15px Segoe UI,Microsoft YaHei';ctx.fillText(s.lat>0?'北半球：向右偏':s.lat<0?'南半球：向左偏':'赤道：水平偏转约为零',box.x+18,box.y+27)}
function diskPoint(cx,cy,r,p){return{x:cx+p.x/DISK_RADIUS*r,y:cy-p.y/DISK_RADIUS*r}}
function drawArcArrow(cx,cy,r,ccw,color){const start=ccw?Math.PI*7/6:Math.PI*11/6,sweep=(ccw?1:-1)*Math.PI*2/3,points=[];for(let i=0;i<=30;i++){const a=start+sweep*i/30;points.push({x:cx+r*Math.cos(a),y:cy-r*Math.sin(a)})}ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();const end=points.at(-1),prev=points.at(-2),dx=end.x-prev.x,dy=end.y-prev.y,m=Math.hypot(dx,dy)||1;arrow(end.x-dx/m*12,end.y-dy/m*12,end.x,end.y,color,3)}
function drawDiskSurface(cx,cy,r,theta,title,subtitle){const g=ctx.createRadialGradient(cx-r*.25,cy-r*.3,r*.08,cx,cy,r);g.addColorStop(0,'#244c63');g.addColorStop(.72,'#132e42');g.addColorStop(1,'#081a29');ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.clip();ctx.strokeStyle='#4c718555';ctx.lineWidth=1;for(let k=1;k<=3;k++){ctx.beginPath();ctx.arc(cx,cy,r*k/4,0,Math.PI*2);ctx.stroke()}for(let i=0;i<12;i++){const a=theta+i*Math.PI/6;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+r*Math.cos(a),cy-r*Math.sin(a));ctx.stroke()}const mark=theta;ctx.fillStyle='#53e0df';ctx.beginPath();ctx.arc(cx+r*.72*Math.cos(mark),cy-r*.72*Math.sin(mark),5,0,Math.PI*2);ctx.fill();ctx.restore();ctx.strokeStyle='#7ab7cf';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();ctx.fillStyle='#effaff';ctx.font='700 16px Segoe UI,Microsoft YaHei';ctx.textAlign='center';ctx.fillText(title,cx,cy-r-30);ctx.fillStyle='#8fb0c1';ctx.font='12px Segoe UI,Microsoft YaHei';ctx.fillText(subtitle,cx,cy-r-10);ctx.textAlign='left';ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fillStyle='#ffcf67';ctx.fill();ctx.strokeStyle='#ffcf6788';ctx.beginPath();ctx.arc(cx,cy,12,0,Math.PI*2);ctx.stroke()}
function drawPath(cx,cy,r,points,color,width=4,dash=[]){ctx.save();ctx.beginPath();ctx.arc(cx,cy,r-1,0,Math.PI*2);ctx.clip();ctx.beginPath();points.forEach((p,i)=>{const q=diskPoint(cx,cy,r,p);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.strokeStyle=color;ctx.lineWidth=width;ctx.setLineDash(dash);ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor=color;ctx.shadowBlur=width>3?7:0;ctx.stroke();ctx.setLineDash([]);ctx.restore();ctx.shadowBlur=0}
function drawDiskBall(cx,cy,r,p,showCoriolis){const q=diskPoint(cx,cy,r,p);ctx.beginPath();ctx.arc(q.x,q.y,8,0,Math.PI*2);ctx.fillStyle='#fff';ctx.shadowColor='#53e0df';ctx.shadowBlur=16;ctx.fill();ctx.shadowBlur=0;if(showCoriolis&&!disk.exited){const s=diskState(),theta=s.omega*disk.t,vRelI={x:disk.vI.x+s.omega*disk.pI.y,y:disk.vI.y-s.omega*disk.pI.x},vR=rotate(vRelI,-theta),ac={x:2*s.omega*vR.y,y:-2*s.omega*vR.x},m=Math.hypot(ac.x,ac.y);if(m>1e-8)arrow(q.x,q.y,q.x+ac.x/m*36,q.y-ac.y/m*36,'#ffd166',3,'aC')}}
function drawDisk(){const side=W>650,layout=side?{r:Math.min(W*.19,H*.31),a:{x:W*.3,y:H*.56},b:{x:W*.72,y:H*.56}}:{r:Math.min(W*.25,H*.14),a:{x:W*.5,y:H*.27},b:{x:W*.5,y:H*.73}},s=diskState();drawDiskSurface(layout.a.x,layout.a.y,layout.r,disk.angle,'地面惯性系','圆盘旋转，小球轨迹为直线');drawDiskSurface(layout.b.x,layout.b.y,layout.r,0,'随盘旋转系','圆盘静止，小球轨迹呈弯曲');drawArcArrow(layout.a.x,layout.a.y,layout.r+10,s.omega>0,'#53e0df');ctx.setLineDash([7,6]);[layout.a,layout.b].forEach(c=>{const p0=diskPoint(c.x,c.y,layout.r,disk.r0);ctx.beginPath();ctx.moveTo(p0.x,p0.y);ctx.lineTo(c.x,c.y);ctx.strokeStyle='#b6c4ca88';ctx.lineWidth=2;ctx.stroke()});ctx.setLineDash([]);drawPath(layout.a.x,layout.a.y,layout.r,disk.previewI,'#53e0df66',2,[5,5]);drawPath(layout.b.x,layout.b.y,layout.r,disk.previewR,'#53e0df66',2,[5,5]);drawPath(layout.a.x,layout.a.y,layout.r,disk.trailI,'#53e0df');drawPath(layout.b.x,layout.b.y,layout.r,disk.trailR,'#53e0df');drawDiskBall(layout.a.x,layout.a.y,layout.r,disk.pI,false);drawDiskBall(layout.b.x,layout.b.y,layout.r,disk.pR,true);ctx.textAlign='center';ctx.fillStyle='#9fb7c4';ctx.font='12px Segoe UI,Microsoft YaHei';ctx.fillText('相机固定在地面',layout.a.x,layout.a.y+layout.r+32);ctx.fillText('相机固定在圆盘上',layout.b.x,layout.b.y+layout.r+32);ctx.textAlign='left';if(side){ctx.strokeStyle='#294b61';ctx.beginPath();ctx.moveTo(W*.51,H*.17);ctx.lineTo(W*.51,H*.87);ctx.stroke()}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#061522';ctx.fillRect(0,0,W,H);mode==='earth'?drawEarth():drawDisk()}
function stepEarth(dt){const s=earthState(),simSeconds=dt*1800,ef=s.f*s.amp,p=earth.particle,steps=Math.max(1,Math.ceil(Math.abs(ef*simSeconds)/.08)),h=simSeconds/steps;for(let i=0;i<steps;i++){const vx=p.vx,vy=p.vy;if(Math.abs(ef)<1e-12){p.x+=vx*h;p.y+=vy*h}else{const q=ef*h,c=Math.cos(q),sn=Math.sin(q);p.x+=(vx*sn+vy*(1-c))/ef;p.y+=(vx*(c-1)+vy*sn)/ef;p.vx=vx*c+vy*sn;p.vy=-vx*sn+vy*c}earth.trail.push({x:p.x,y:p.y})}earth.elapsed+=simSeconds/3600;if(earth.trail.length>900)earth.trail.splice(0,earth.trail.length-900);if(earth.elapsed>=10)resetEarth()}
function stepDisk(dt){const s=diskState();disk.t+=dt*.7;disk.angle=s.omega*disk.t;disk.pI={x:disk.r0.x+disk.vI.x*disk.t,y:disk.r0.y+disk.vI.y*disk.t};disk.pR=rotate(disk.pI,-disk.angle);disk.trailI.push({...disk.pI});disk.trailR.push({...disk.pR});if(Math.hypot(disk.pI.x,disk.pI.y)>DISK_RADIUS*1.04||disk.t>12){disk.exited=true;running=false;updateButtons()}}
function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}
animation=PhysicsLab.createAnimation({update:dt=>{if(running)(mode==='earth'?stepEarth(dt):stepDisk(dt))},render:()=>{updateUI();draw()},isActive:()=>running});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));[ui.lat,ui.speed,ui.angle,ui.scale].forEach(el=>el.addEventListener('input',()=>{resetEarth();running=true;updateButtons()}));[ui.rpm,ui.ballSpeed].forEach(el=>el.addEventListener('input',()=>{resetDisk();running=true;updateButtons()}));document.querySelectorAll('[data-angle]').forEach(b=>b.onclick=()=>{ui.angle.value=b.dataset.angle;resetCurrent()});document.querySelectorAll('[data-lat]').forEach(b=>b.onclick=()=>{ui.lat.value=b.dataset.lat;resetCurrent()});document.querySelectorAll('[data-spin]').forEach(b=>b.onclick=()=>{spinDirection=+b.dataset.spin;resetCurrent()});ui.play.onclick=()=>{if(mode==='disk'&&disk.exited){resetDisk();running=true}else running=!running;updateButtons()};ui.reset.onclick=resetCurrent;window.addEventListener('resize',resize);resetEarth();resetDisk();setMode(new URLSearchParams(location.search).get('mode')==='disk'?'disk':'earth');resize();animation.start();
</script>

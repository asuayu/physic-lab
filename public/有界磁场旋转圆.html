<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07111f">
    <meta name="description" content="用旋转圆、平移圆、磁汇聚和磁发散模型观察有界磁场中带电粒子的轨迹、交点、荷质比与运动周期。">
    <title>有界磁场中的带电粒子｜旋转圆法</title>
    <style>
        :root {
            --bg: #07111f;
            --panel: #0e1b2e;
            --panel-2: #12233a;
            --line: #263b55;
            --text: #eaf2ff;
            --muted: #8fa5be;
            --violet: #a78bfa;
            --cyan: #38bdf8;
            --green: #4ade80;
            --amber: #fbbf24;
            --rose: #fb7185;
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            color: var(--text);
            background: var(--bg);
            font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        }

        .controls {
            width: 336px;
            flex: 0 0 auto;
            padding: 22px 20px;
            overflow-y: auto;
            background: linear-gradient(180deg, #101f34 0%, #0b1728 100%);
            border-right: 1px solid var(--line);
            box-shadow: 12px 0 40px rgba(0, 0, 0, .24);
            z-index: 2;
        }

        .eyebrow {
            color: var(--violet);
            font: 700 11px/1.2 ui-monospace, monospace;
            letter-spacing: .18em;
            text-transform: uppercase;
        }
        h1 { margin: 8px 0 6px; font-size: 22px; line-height: 1.28; letter-spacing: .02em; }
        .intro { margin: 0 0 20px; color: var(--muted); font-size: 13px; line-height: 1.65; }

        .section {
            padding: 15px 0;
            border-top: 1px solid rgba(143, 165, 190, .16);
        }
        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 13px;
            font-size: 12px;
            font-weight: 700;
            color: #c7d7ea;
            letter-spacing: .08em;
        }
        .section-title::before { content: ""; width: 4px; height: 14px; border-radius: 2px; background: var(--violet); }
        label.value-row { display: flex; justify-content: space-between; gap: 12px; margin: 11px 0 7px; color: var(--muted); font-size: 13px; }
        .value { color: var(--text); font: 700 13px ui-monospace, monospace; }

        input[type="range"] { width: 100%; height: 5px; accent-color: var(--violet); cursor: pointer; }
        .segmented { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .mode-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        button {
            min-height: 40px;
            border: 1px solid var(--line);
            border-radius: 9px;
            color: #c8d7e8;
            background: #142740;
            font: 650 13px inherit;
            cursor: pointer;
            transition: .18s ease;
        }
        button:hover { border-color: #4c6787; background: #19304e; transform: translateY(-1px); }
        button:disabled { cursor: default; opacity: .42; transform: none; }
        .unavailable { opacity: .5; }
        button.active { border-color: var(--violet); color: #f3efff; background: rgba(167, 139, 250, .15); box-shadow: inset 0 0 0 1px rgba(167,139,250,.1); }
        button.primary { border-color: #7c5ce0; color: #fff; background: linear-gradient(135deg, #7c3aed, #6d5ce7); box-shadow: 0 8px 22px rgba(124, 58, 237, .24); }
        .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .actions .primary { grid-column: 1 / -1; }

        .checks { display: grid; gap: 9px; }
        .check { display: flex; gap: 9px; align-items: center; color: #b9c9da; font-size: 13px; cursor: pointer; }
        .check input { width: 16px; height: 16px; accent-color: var(--violet); }

        .formula {
            padding: 12px 13px;
            border: 1px solid rgba(56,189,248,.22);
            border-radius: 10px;
            color: #b7cae0;
            background: rgba(5,14,27,.5);
            font-size: 12px;
            line-height: 1.7;
        }
        .formula strong { color: var(--cyan); font-family: Cambria, serif; font-size: 15px; }

        .canvas-container { position: relative; flex: 1 1 auto; min-width: 0; min-height: 0; overflow: hidden; }
        .canvas-container::before {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(circle at 55% 48%, rgba(26, 52, 83, .3), transparent 50%),
                        linear-gradient(rgba(92,124,158,.035) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(92,124,158,.035) 1px, transparent 1px);
            background-size: auto, 32px 32px, 32px 32px;
        }
        canvas { display: block; width: 100%; height: 100%; position: relative; }

        .btn-home {
            position: absolute; z-index: 5; top: 18px; right: 20px;
            padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
            color: #afc2d8; background: rgba(10, 24, 41, .82); backdrop-filter: blur(8px);
            text-decoration: none; font-size: 13px; font-weight: 650;
        }
        .btn-home:hover { border-color: var(--violet); color: #fff; }

        .readout {
            position: absolute; z-index: 3; left: 20px; top: 18px; min-width: 220px;
            padding: 13px 15px; border: 1px solid rgba(70, 94, 124, .7); border-radius: 12px;
            background: rgba(8, 20, 35, .78); backdrop-filter: blur(10px);
            box-shadow: 0 16px 44px rgba(0,0,0,.2); pointer-events: none;
        }
        .readout-head { display: flex; align-items: center; gap: 8px; color: #c8d7e7; font-size: 12px; font-weight: 700; }
        .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 10px var(--green); }
        .readout-grid { display: grid; grid-template-columns: auto auto; gap: 5px 18px; margin-top: 9px; color: var(--muted); font: 12px/1.45 ui-monospace, monospace; }
        .readout-grid b { color: var(--text); text-align: right; font-weight: 650; }

        .hint {
            position: absolute; z-index: 3; left: 50%; bottom: 18px; transform: translateX(-50%);
            padding: 8px 13px; border: 1px solid rgba(70,94,124,.55); border-radius: 99px;
            color: #9fb2c8; background: rgba(8,20,35,.72); backdrop-filter: blur(8px);
            font-size: 12px; pointer-events: none; white-space: nowrap;
        }

        @media (max-width: 900px) {
            .controls { width: 100%; max-height: 43dvh; padding: 14px 16px; }
            h1 { font-size: 18px; }
            .intro { display: none; }
            .readout { left: 10px; top: 10px; min-width: 185px; padding: 9px 11px; }
            .readout-grid { gap: 3px 12px; }
            .hint { bottom: 10px; max-width: calc(100% - 20px); overflow: hidden; text-overflow: ellipsis; }
        }
    </style>
    <link rel="stylesheet" href="/lab-common.css">
    <script src="/lab-runtime.js"></script>
</head>
<body>
    <aside class="controls">
        <div class="eyebrow">Electromagnetism · 02</div>
        <h1>带电粒子 · 典型圆法</h1>
        <p class="intro">对比平移圆、旋转圆以及粒子束的磁汇聚和磁发散，观察圆心、相位与荷质比的作用。</p>

        <section class="section">
            <div class="section-title">典型模型</div>
            <div class="mode-grid" id="modeGroup">
                <button type="button" data-mode="rotate" class="active">旋转圆</button>
                <button type="button" data-mode="translate">平移圆</button>
                <button type="button" data-mode="focus">磁汇聚</button>
                <button type="button" data-mode="diverge">磁发散</button>
            </div>
        </section>

        <section class="section">
            <div class="section-title">发射与边界</div>
            <label class="value-row" for="angle"><span>发射方向 α（0° 水平向左）</span><span class="value" id="angleValue">62°</span></label>
            <input id="angle" type="range" min="0" max="360" step="0.1" value="62">
            <label class="value-row" for="height"><span>板距 h / r</span><span class="value" id="heightValue">1.20</span></label>
            <input id="height" type="range" min="0.35" max="1.90" step="0.01" value="1.20">
        </section>

        <section class="section">
            <div class="section-title">洛伦兹力方向</div>
            <div class="segmented" id="chargeGroup">
                <button type="button" data-sign="1" class="active">q &gt; 0</button>
                <button type="button" data-sign="-1">q &lt; 0</button>
            </div>
            <div class="segmented" id="fieldGroup" style="margin-top:8px">
                <button type="button" data-sign="1">⊙ B 向外</button>
                <button type="button" data-sign="-1" class="active">⊗ B 向里</button>
            </div>
        </section>

        <section class="section">
            <div class="section-title">动态演示</div>
            <div class="actions">
                <button type="button" class="primary" id="launch">▶ 发射粒子</button>
                <button type="button" id="rotate">⟳ 自动改变方向</button>
                <button type="button" id="reset">↺ 回到初始</button>
                <button type="button" id="tangent" style="grid-column:1 / -1">⊥ 跳到临界相切角</button>
            </div>
        </section>

        <section class="section">
            <div class="section-title">几何辅助</div>
            <div class="checks">
                <label class="check"><input id="showFamily" type="checkbox" checked> 显示不同角度的轨迹圆</label>
                <label class="check"><input id="showVectors" type="checkbox" checked> 显示速度与洛伦兹力</label>
                <label class="check"><input id="showGeometry" type="checkbox" checked> 显示半径与圆心角</label>
            </div>
        </section>

        <div class="formula">
            <strong>r = mv / |q|B　　s = rθ</strong><br>
            <span id="modeExplanation">r 固定时，圆心 C 在以 O 为圆心、r 为半径的圆上移动。先求轨迹圆与直线 y = h 的首个交点 P，再由运动方向确定圆心角 θ 和弧长 s。</span>
        </div>
    </aside>

    <main class="canvas-container" id="stage">
        <a href="/" class="btn-home">⌂ 返回展厅</a>
        <div class="readout">
            <div class="readout-head"><span class="pulse" id="pulse"></span><span id="stateText">可到达上板</span></div>
            <div class="readout-grid">
                <span id="positionLabel">交点位置 xₚ</span><b id="positionOut">—</b>
                <span id="sweepLabel">圆心角 θ</span><b id="sweepOut">—</b>
                <span id="lengthLabel">轨迹长度 s</span><b id="lengthOut">—</b>
                <span id="timeLabel">运动时间 t</span><b id="timeOut">—</b>
            </div>
        </div>
        <div class="hint">改变 α：轨迹圆绕发射点 O 旋转，观察交点 P 和弧长 s 的变化</div>
        <canvas id="simCanvas" role="img" tabindex="0" aria-label="带电粒子从固定点以不同方向发射并与磁场上边界相交的旋转圆动态演示"></canvas>
    </main>

    <script type="module">
        import { magneticOrbit } from "/lab-physics.js";

        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');
        const stage = document.getElementById('stage');
        const angleInput = document.getElementById('angle');
        const heightInput = document.getElementById('height');
        const angleValue = document.getElementById('angleValue');
        const heightValue = document.getElementById('heightValue');
        const launchBtn = document.getElementById('launch');
        const rotateBtn = document.getElementById('rotate');
        const tangentBtn = document.getElementById('tangent');
        const pulse = document.getElementById('pulse');

        const state = {
            demoMode: 'rotate',
            alpha: 62 * Math.PI / 180, height: 1.2, q: 1, B: -1,
            particleT: 0, running: false, rotating: false,
            trail: [], lastTime: 0
        };
        const colors = { orbit:'#a78bfa', particle:'#fbbf24', velocity:'#4ade80', green:'#4ade80', force:'#fb7185', geometry:'#38bdf8' };
        let raf = 0, pulseColor = null;
        function setText(id,value){const element=document.getElementById(id);if(element.textContent!==value)element.textContent=value;}
        function invalidate(){if(!raf&&!document.hidden)raf=requestAnimationFrame(animate);}
        // Public runtime supplies timing; retain a local timing fallback for isolated previews.
        const frameScale = window.PhysicsLab?.frameScale ?? ((timestamp, previousTimestamp, maxFrames = 3) => {
            if (!Number.isFinite(previousTimestamp) || previousTimestamp <= 0) return 1;
            return Math.min(Math.max(0, timestamp - previousTimestamp) / (1000 / 60), maxFrames);
        });
        function mod(a) { return ((a % (Math.PI*2)) + Math.PI*2) % (Math.PI*2); }
        function deg(a) { return a * 180 / Math.PI; }

        function model(alpha = state.alpha) {
            return magneticOrbit({ alpha, height: state.height, q: state.q, B: state.B });
        }

        function tangentAngles() {
            const turn = state.q * state.B;
            const cosine = (state.height - 1) / turn;
            if (Math.abs(cosine) > 1) return [];
            const first = Math.acos(Math.max(-1, Math.min(1, cosine)));
            return first < 1e-9 || Math.abs(first-Math.PI) < 1e-9 ? [first] : [first, Math.PI*2-first];
        }

        function nearestTangentAngle() {
            const choices = tangentAngles();
            if (!choices.length) return null;
            return choices.reduce((best, angle) => {
                const distance = Math.abs(Math.atan2(Math.sin(angle-state.alpha), Math.cos(angle-state.alpha)));
                const bestDistance = Math.abs(Math.atan2(Math.sin(best-state.alpha), Math.cos(best-state.alpha)));
                return distance < bestDistance ? angle : best;
            });
        }

        function resize() {
            const rect = stage.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
            canvas.width = Math.round(rect.width*dpr); canvas.height = Math.round(rect.height*dpr);
            canvas.style.width = rect.width+'px'; canvas.style.height = rect.height+'px';
            ctx.setTransform(dpr,0,0,dpr,0,0);
            invalidate();
        }
        function viewport() {
            const w=stage.clientWidth, h=stage.clientHeight;
            return {ox:w*.55, oy:h*.72, scale:Math.min(w*.17,h*.235,190)};
        }
        function screen(p,vp) { return {x:vp.ox+p.x*vp.scale, y:vp.oy-p.y*vp.scale}; }
        function line(a,b,color,width=1,dash=[]) {
            ctx.save(); ctx.strokeStyle=color; ctx.lineWidth=width; ctx.setLineDash(dash);
            ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke(); ctx.restore();
        }
        function dot(p,r,fill,stroke=null) {
            ctx.save(); ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fillStyle=fill;
            ctx.shadowColor=fill; ctx.shadowBlur=r>5?13:0; ctx.fill();
            if(stroke){ctx.shadowBlur=0;ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();} ctx.restore();
        }
        function text(label,p,color='#d9e6f3',align='center',size=12) {
            ctx.save(); ctx.font=`600 ${size}px "Segoe UI",sans-serif`;ctx.textAlign=align;ctx.fillStyle=color;
            ctx.shadowColor='#07111f';ctx.shadowBlur=5;ctx.fillText(label,p.x,p.y);ctx.restore();
        }
        function arrow(from,vec,color,label,size=44) {
            const m=Math.hypot(vec.x,vec.y)||1, ux=vec.x/m, uy=-vec.y/m;
            const to={x:from.x+ux*size,y:from.y+uy*size}, nx=-uy,ny=ux;
            line(from,to,color,2.4);line(to,{x:to.x-ux*9+nx*5,y:to.y-uy*9+ny*5},color,2.4);
            line(to,{x:to.x-ux*9-nx*5,y:to.y-uy*9-ny*5},color,2.4);
            text(label,{x:to.x+nx*10,y:to.y+ny*10},color,'center',12);
        }
        function pointOnOrbit(m,t) {
            const phi=m.phi0+m.direction*m.sweep*t;
            return {x:m.C.x+Math.cos(phi),y:m.C.y+Math.sin(phi),phi};
        }
        function orbitArc(m,vp,progress=1,color=colors.orbit,width=3,opacity=1) {
            const C=screen(m.C,vp), start=-m.phi0, end=start-m.direction*m.sweep*progress;
            ctx.save();ctx.globalAlpha=opacity;ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';
            ctx.beginPath();ctx.arc(C.x,C.y,vp.scale,start,end,m.direction>0);ctx.stroke();ctx.restore();
        }
        function drawField(vp,plateY) {
            const w=stage.clientWidth,h=stage.clientHeight;
            const grad=ctx.createLinearGradient(0,plateY,0,h);grad.addColorStop(0,'rgba(124,58,237,.13)');grad.addColorStop(1,'rgba(28,42,74,.025)');
            ctx.fillStyle=grad;ctx.fillRect(0,plateY,w,h-plateY);
            ctx.save();ctx.strokeStyle='rgba(167,139,250,.25)';ctx.lineWidth=1;
            const gap=36;
            for(let x=24;x<w;x+=gap) for(let y=plateY+25;y<h;y+=gap) {
                if(state.B<0){ctx.beginPath();ctx.moveTo(x-3,y-3);ctx.lineTo(x+3,y+3);ctx.moveTo(x+3,y-3);ctx.lineTo(x-3,y+3);ctx.stroke();}
                else{ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(x,y,.8,0,Math.PI*2);ctx.fillStyle='rgba(167,139,250,.5)';ctx.fill();}
            } ctx.restore();
            const plateLeft=w*.09, plateRight=w*.91, plateThickness=10;
            ctx.save();
            const plateGradient=ctx.createLinearGradient(0,plateY-plateThickness,0,plateY);
            plateGradient.addColorStop(0,'#d7e2ef');plateGradient.addColorStop(1,'#788da8');
            ctx.fillStyle=plateGradient;ctx.fillRect(plateLeft,plateY-plateThickness,plateRight-plateLeft,plateThickness);
            ctx.strokeStyle='#eef5fc';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(plateLeft,plateY-plateThickness);ctx.lineTo(plateRight,plateY-plateThickness);ctx.stroke();
            // y = h 对应板的下表面；轨迹和交点均精确终止于此线。
            ctx.strokeStyle='#f5c2cc';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(plateLeft,plateY);ctx.lineTo(plateRight,plateY);ctx.stroke();ctx.restore();
            text('a',{x:plateLeft-10,y:plateY+5},'#8fa5be','right',13); text('b',{x:plateRight+10,y:plateY+5},'#8fa5be','left',13);
            text('上方板（下表面 y = h）',{x:w*.5,y:plateY-plateThickness-9},'#c2d1e1','center',13);
        }
        function drawAngle(O) {
            ctx.save();ctx.strokeStyle=colors.geometry;ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(O.x,O.y,34,Math.PI,Math.PI-state.alpha,true);ctx.stroke();ctx.restore();
            text('α',{x:O.x-43*Math.cos(state.alpha/2),y:O.y+43*Math.sin(state.alpha/2)},colors.geometry);
        }

        function drawSpecialField() {
            const w=stage.clientWidth,h=stage.clientHeight;
            const gradient=ctx.createLinearGradient(0,0,0,h);gradient.addColorStop(0,'rgba(124,58,237,.035)');gradient.addColorStop(1,'rgba(124,58,237,.12)');
            ctx.fillStyle=gradient;ctx.fillRect(0,0,w,h);
            ctx.save();ctx.strokeStyle='rgba(167,139,250,.19)';ctx.lineWidth=1;
            for(let x=28;x<w;x+=42)for(let y=32;y<h;y+=42){ctx.beginPath();ctx.moveTo(x-3,y-3);ctx.lineTo(x+3,y+3);ctx.moveTo(x+3,y-3);ctx.lineTo(x-3,y+3);ctx.stroke();}
            ctx.restore();
        }

        function drawOrbitCircle(C,r,color='rgba(167,139,250,.35)',dash=[6,7]) {
            ctx.save();ctx.strokeStyle=color;ctx.lineWidth=1.3;ctx.setLineDash(dash);ctx.beginPath();ctx.arc(C.x,C.y,r,0,Math.PI*2);ctx.stroke();ctx.restore();
        }

        function orbitParticle(O,r,phase) {
            const C={x:O.x-r,y:O.y}, angle=-phase;
            return {C,P:{x:C.x+r*Math.cos(angle),y:C.y+r*Math.sin(angle)}};
        }

        function specialReadout(labels,values,title) {
            ['position','sweep','length','time'].forEach((key,i)=>{
                setText(key+'Label',labels[i]);
                setText(key+'Out',values[i]);
            });
            setText('stateText',title);
        }

        function drawSpecialMode(mode) {
            const w=stage.clientWidth,h=stage.clientHeight;
            ctx.clearRect(0,0,w,h);drawSpecialField();
            const t=(state.running||state.particleT>0)?state.particleT:.32;
            const baseY=h*.60, baseX=w*.53, R=Math.min(92,w*.095,h*.16);
            const title={translate:'平移圆：入射点与圆心同步平移',focus:'磁汇聚：同荷质比粒子同周期返回',diverge:'磁发散：不同荷质比导致半径与相位分离'}[mode];
            text(title,{x:w*.58,y:h*.18},'#e5edf7','center',17);

            if(mode==='translate') {
                const offsets=[-2,-1,0,1,2].map(n=>n*R*1.12);
                offsets.forEach((dx,i)=>{
                    const O={x:baseX+dx,y:baseY}, item=orbitParticle(O,R,Math.PI*1.55*t);
                    drawOrbitCircle(item.C,R,`rgba(167,139,250,${.18+i*.045})`);
                    dot(O,3.5,'#4ade80');dot(item.C,2.8,'#38bdf8');dot(item.P,6,colors.particle,'#fff5c9');
                    line(O,item.C,'rgba(56,189,248,.32)',1,[4,5]);
                    if(i===2)arrow(O,{x:0,y:1},colors.velocity,'v',40);
                });
                line({x:baseX-2.4*R,y:baseY+22},{x:baseX+2.4*R,y:baseY+22},'rgba(74,222,128,.55)',1.2,[5,5]);
                text('入射点整体平移 Δx',{x:baseX,y:baseY+46},'#9fb5cc','center',13);
                specialReadout(['轨迹圆数量','半径关系','速度关系','圆心位移'],['5 个','r 相同','v 平行同速','ΔC = ΔO'],'平移圆演示');
            } else if(mode==='focus') {
                const radii=[.58,.72,.86,1,1.14,1.28,1.42].map(k=>R*k);
                const O={x:baseX-R*.15,y:baseY+R*.55}, phase=Math.PI*2*t;
                radii.forEach((r,i)=>{
                    const item=orbitParticle(O,r,phase);drawOrbitCircle(item.C,r,`rgba(56,189,248,${.14+i*.035})`);
                    dot(item.P,5,i===3?colors.particle:'rgba(251,191,36,.72)');
                });
                dot(O,7,colors.green,'#eafff0');text('焦点 O',{x:O.x-11,y:O.y+24},colors.green,'right',13);
                text('不同速率 → 不同 r；相同 q/m → 相同 ω',{x:w*.58,y:h*.84},'#9fb5cc','center',13);
                specialReadout(['速率范围','轨道半径','角速度 ω','汇聚时刻'],['0.58v–1.42v','∝ v','相同','T = 2π/ω'],'同周期磁汇聚');
            } else {
                const factors=[.62,.78,.92,1.08,1.25,1.45];
                const O={x:baseX-R*.55,y:baseY+R*.55};
                factors.forEach((k,i)=>{
                    const r=R/k, phase=Math.PI*1.55*k*t, item=orbitParticle(O,r,phase);
                    drawOrbitCircle(item.C,r,`rgba(251,113,133,${.12+i*.04})`);
                    dot(item.P,5,`hsl(${35-i*5} 90% ${62+i*2}%)`);
                });
                dot(O,7,colors.green,'#eafff0');text('同一入射点',{x:O.x-10,y:O.y+25},colors.green,'right',13);
                text('q/m 不同 → r = mv/|q|B、ω = |q|B/m 均不同',{x:w*.58,y:h*.84},'#9fb5cc','center',13);
                specialReadout(['荷质比范围','轨道半径','角速度 ω','束流结果'],['0.62–1.45','各不相同','各不相同','逐渐分离'],'荷质比分散');
            }
            document.getElementById('positionOut').style.color=mode==='diverge'?colors.force:mode==='focus'?colors.velocity:'';
        }

        function draw() {
            if(state.demoMode!=='rotate'){drawSpecialMode(state.demoMode);return;}
            const vp=viewport(), m=model(), O=screen(m.O,vp), C=screen(m.C,vp);
            const plateY=screen({x:0,y:state.height},vp).y;
            ctx.clearRect(0,0,stage.clientWidth,stage.clientHeight); drawField(vp,plateY);

            if(document.getElementById('showFamily').checked) {
                [0,45,90,135,180,225,270,315].forEach(a => {
                    if(Math.abs(a-deg(state.alpha))<4)return;
                    const g=model(a*Math.PI/180), gc=screen(g.C,vp);
                    ctx.save();ctx.strokeStyle='rgba(167,139,250,.15)';ctx.lineWidth=1;ctx.setLineDash([5,8]);
                    ctx.beginPath();ctx.arc(gc.x,gc.y,vp.scale,0,Math.PI*2);ctx.stroke();ctx.restore();
                    if(g.hit){const gp=screen(g.P,vp);dot(gp,2.5,'rgba(251,113,133,.48)');}
                });
            }
            ctx.save();ctx.strokeStyle='rgba(167,139,250,.38)';ctx.lineWidth=1.4;ctx.setLineDash([7,6]);
            ctx.beginPath();ctx.arc(C.x,C.y,vp.scale,0,Math.PI*2);ctx.stroke();ctx.restore();
            orbitArc(m,vp,1,m.hit?colors.orbit:'#64748b',m.hit?3:2,m.hit?1:.75);

            if(document.getElementById('showGeometry').checked) {
                line(O,C,'rgba(56,189,248,.8)',1.5,[5,5]);
                if(m.hit){const P=screen(m.P,vp);line(C,P,'rgba(56,189,248,.75)',1.4);line(O,P,'rgba(251,191,36,.48)',1.2,[5,5]);}
                drawAngle(O);dot(C,4,colors.geometry);text('C',{x:C.x+9,y:C.y-9},colors.geometry,'left');
                text('r',{x:(O.x+C.x)/2+8,y:(O.y+C.y)/2-6},colors.geometry);
            }
            dot(O,6,colors.green,'#eafff0');text('发射点 O',{x:O.x-12,y:O.y+24},colors.green,'right',12);
            if(m.hit){
                const P=screen(m.P,vp);dot(P,6,colors.force,'#ffe6eb');
                text(m.tangent?'切点 T':'交点 P',{x:P.x,y:P.y-14},colors.force,'center',14);
                if(m.tangent){
                    const side=m.C.x<=m.P.x?1:-1;
                    line({x:P.x,y:P.y+2},{x:P.x,y:P.y+13},'#fbbf24',1.5);
                    line({x:P.x,y:P.y+13},{x:P.x+side*11,y:P.y+13},'#fbbf24',1.5);
                    line({x:P.x+side*11,y:P.y+13},{x:P.x+side*11,y:P.y+2},'#fbbf24',1.5);
                }
            }

            const p=pointOnOrbit(m,state.particleT), ps=screen(p,vp);
            state.trail.forEach((q,i)=>{const t=screen(q,vp);dot(t,1.2+i/Math.max(1,state.trail.length)*1.5,`rgba(251,191,36,${.07+i/state.trail.length*.28})`);});
            dot(ps,7.5,colors.particle,'#fff5c9');
            if(document.getElementById('showVectors').checked){
                const tangent=p.phi+m.direction*Math.PI/2;
                arrow(ps,{x:Math.cos(tangent),y:Math.sin(tangent)},colors.velocity,'v',46);
                arrow(ps,{x:m.C.x-p.x,y:m.C.y-p.y},colors.force,'Fᴸ',38);
            }
            updateReadout(m);
        }
        function updateReadout(m) {
            setText('positionOut',m.hit?(m.P.x>=0?'+':'')+m.P.x.toFixed(3)+' r':'不可达');
            setText('sweepOut',m.hit?deg(m.sweep).toFixed(1)+'°':'—');
            setText('lengthOut',m.hit?m.sweep.toFixed(3)+' r':'—');
            setText('timeOut',m.hit?m.sweep.toFixed(3)+' / ω':'—');
        }
        function resetParticle(){state.running=false;state.particleT=0;state.trail=[];state.lastTime=0;launchBtn.textContent=state.demoMode==='rotate'?'▶ 发射粒子':'▶ 播放粒子束';invalidate();}
        function displayAngle(){const value=deg(state.alpha);return (Math.abs(value-Math.round(value))<.005?Math.round(value):value.toFixed(3))+'°';}
        function syncInputs(){angleInput.value=deg(state.alpha);angleValue.textContent=displayAngle();heightValue.textContent=state.height.toFixed(2);}
        angleInput.addEventListener('input',()=>{
            state.alpha=Number(angleInput.value)*Math.PI/180;
            const critical=nearestTangentAngle();
            if(critical!==null&&Math.abs(Math.atan2(Math.sin(critical-state.alpha),Math.cos(critical-state.alpha)))<0.06*Math.PI/180)state.alpha=critical;
            syncInputs();resetParticle();
        });
        heightInput.addEventListener('input',()=>{state.height=Number(heightInput.value);heightValue.textContent=state.height.toFixed(2);resetParticle();});
        document.querySelectorAll('#chargeGroup button').forEach(btn=>btn.addEventListener('click',()=>{state.q=Number(btn.dataset.sign);document.querySelectorAll('#chargeGroup button').forEach(b=>b.classList.toggle('active',b===btn));resetParticle();}));
        document.querySelectorAll('#fieldGroup button').forEach(btn=>btn.addEventListener('click',()=>{state.B=Number(btn.dataset.sign);document.querySelectorAll('#fieldGroup button').forEach(b=>b.classList.toggle('active',b===btn));resetParticle();}));
        launchBtn.addEventListener('click',()=>{
            if(state.particleT>=1){state.particleT=0;state.trail=[];}
            state.rotating=false;rotateBtn.classList.remove('active');rotateBtn.textContent='⟳ 自动改变方向';
            state.running=!state.running;state.lastTime=0;
            launchBtn.textContent=state.running?'Ⅱ 暂停粒子':'▶ 继续运动';invalidate();
        });
        rotateBtn.addEventListener('click',()=>{
            state.rotating=!state.rotating;resetParticle();
            rotateBtn.classList.toggle('active',state.rotating);
            rotateBtn.textContent=state.rotating?'Ⅱ 停止改变':'⟳ 自动改变方向';invalidate();
        });
        tangentBtn.addEventListener('click',()=>{
            const angle=nearestTangentAngle();
            if(angle===null){tangentBtn.textContent='当前板距不存在相切轨迹';setTimeout(()=>tangentBtn.textContent='⊥ 跳到临界相切角',1400);return;}
            state.alpha=angle;state.rotating=false;rotateBtn.classList.remove('active');rotateBtn.textContent='⟳ 自动改变方向';resetParticle();syncInputs();
        });
        document.getElementById('reset').addEventListener('click',()=>{
            state.alpha=62*Math.PI/180;state.height=1.2;state.q=1;state.B=-1;state.rotating=false;heightInput.value=1.2;
            setMode('rotate');
            document.querySelectorAll('#chargeGroup button').forEach(b=>b.classList.toggle('active',b.dataset.sign==='1'));
            document.querySelectorAll('#fieldGroup button').forEach(b=>b.classList.toggle('active',b.dataset.sign==='-1'));
            rotateBtn.classList.remove('active');rotateBtn.textContent='⟳ 自动改变方向';resetParticle();syncInputs();
        });
        const modeDescriptions={
            rotate:'r 固定时，圆心 C 在以 O 为圆心、r 为半径的圆上移动。先求轨迹圆与直线 y = h 的首个交点 P，再由运动方向确定圆心角 θ 和弧长 s。',
            translate:'固定 q > 0、B 向里和竖直向上的初速度。平移发射点时，半径和转向不变，圆心随发射点平移相同距离。',
            focus:'固定 q > 0、B 向里。不同速率粒子的半径不同，但荷质比相同时 ω = |q|B/m 相同，经过一个周期同时回到发射点。',
            diverge:'固定同速、同方向入射和 B 向里。粒子的正荷质比不同，因此半径与角速度均不同，束流逐渐分离。',
        };
        function setMode(mode){
            state.demoMode=mode;state.rotating=false;
            const rotationMode=mode==='rotate';
            if(!rotationMode){
                state.q=1;state.B=-1;
                document.querySelectorAll('#chargeGroup button').forEach(button=>button.classList.toggle('active',button.dataset.sign==='1'));
                document.querySelectorAll('#fieldGroup button').forEach(button=>button.classList.toggle('active',button.dataset.sign==='-1'));
            }
            document.querySelectorAll('#modeGroup button').forEach(button=>{
                const active=button.dataset.mode===mode;
                button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active));
            });
            [angleInput,heightInput,rotateBtn,tangentBtn,...document.querySelectorAll('#chargeGroup button,#fieldGroup button,.checks input')]
                .forEach(control=>control.disabled=!rotationMode);
            [angleInput.closest('section'),document.getElementById('chargeGroup').closest('section'),document.querySelector('.checks').closest('section')]
                .forEach(section=>section.classList.toggle('unavailable',!rotationMode));
            setText('modeExplanation',modeDescriptions[mode]);
            document.querySelector('.hint').textContent=rotationMode
                ?'改变 α：轨迹圆绕发射点 O 旋转，观察交点 P 和弧长 s 的变化'
                :'本模式采用说明中的固定参数；点击“播放粒子束”观察运动';
            if(rotationMode){
                specialReadout(['交点位置 xₚ','圆心角 θ','轨迹长度 s','运动时间 t'],['—','—','—','—'],'旋转圆');
                document.getElementById('positionOut').style.color='';
            }
            rotateBtn.classList.remove('active');rotateBtn.textContent='⟳ 自动改变方向';
            resetParticle();
        }
        document.querySelectorAll('#modeGroup button').forEach(button=>button.addEventListener('click',()=>setMode(button.dataset.mode)));
        document.querySelectorAll('.checks input').forEach(input=>input.addEventListener('change',invalidate));
        canvas.addEventListener('keydown',event=>{
            if(event.code==='Space'){event.preventDefault();launchBtn.click();}
        });
        function animate(timestamp){
            raf=0;
            const dt=frameScale(timestamp,state.lastTime,2.5);state.lastTime=timestamp;
            if(state.rotating){state.alpha=mod(state.alpha+.0055*dt);syncInputs();}
            if(state.running){
                const m=model();
                // Fixed cyclotron angular speed: short and long arcs differ only in flight time.
                const increment=state.demoMode==='rotate'?.006*Math.PI*dt/m.sweep:.006*dt;
                state.particleT=Math.min(1,state.particleT+increment);
                if(state.demoMode==='rotate'&&Math.floor(timestamp/28)!==Math.floor((timestamp-16.7*dt)/28))state.trail.push(pointOnOrbit(m,state.particleT));
                if(state.trail.length>60)state.trail.shift();
                if(state.particleT>=1){
                    state.running=false;
                    launchBtn.textContent=state.demoMode!=='rotate'?'↻ 再次播放':m.hit?'↻ 再次发射':'↻ 未碰板，再试一次';
                }
            }
            const m=model();
            if(state.demoMode==='rotate'){
                setText('stateText',state.rotating?'发射方向改变中':state.running?'粒子运动中':m.tangent?'临界状态：轨迹与板相切':m.hit?(state.particleT>=1?'已到达上板':'轨迹与板相交'):'当前方向无法到达上板');
            }
            const color=state.demoMode==='rotate'&&!m.hit?colors.force:state.running?colors.particle:colors.velocity;
            if(pulseColor!==color){pulseColor=color;pulse.style.background=color;pulse.style.boxShadow=`0 0 10px ${color}`;}
            draw();
            if(state.running||state.rotating)invalidate();
        }
        document.addEventListener('visibilitychange',()=>{
            if(document.hidden){cancelAnimationFrame(raf);raf=0;}
            else{state.lastTime=0;invalidate();}
        });
        window.addEventListener('resize',resize);
        new ResizeObserver(resize).observe(stage);
        resize();syncInputs();setMode('rotate');
    </script>
</body>
</html>

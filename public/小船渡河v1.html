<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小船渡河与速度合成 (Physics Lab)</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --accent: #0ea5e9;       /* 核心主色调: 天蓝色 */
            --v1-color: #10b981;     /* 水流速绿色 v1 */
            --v2-color: #3b82f6;     /* 船速蓝色 v2 */
            --vres-color: #ef4444;   /* 合速度红色 v_res */
            --river-color: #0c4a6e;  /* 河水底色 */
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .controls {
            width: 320px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 4px 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            border-right: 1px solid #334155;
            overflow-y: auto;
        }
        .controls::-webkit-scrollbar { width: 6px; }
        .controls::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

        h2 { 
            margin: 0; 
            font-size: 1.3rem; 
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2::before {
            content: '';
            display: block;
            width: 5px;
            height: 24px;
            background: var(--accent);
            border-radius: 4px;
        }
        
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        
        label { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.95rem; 
            color: var(--text-muted); 
            font-weight: 500;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background: #334155;
            border: 1px solid #475569;
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.95rem;
        }
        button:hover { background: #475569; }
        button.active { 
            background: rgba(14, 165, 233, 0.15); 
            color: var(--accent); 
            border-color: var(--accent); 
        }
        
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        .btn-group button { flex: 1; margin: 0; }
        button.action-play { background: var(--accent); color: #fff; border: none; }
        button.action-play:hover { background: #0284c7; box-shadow: 0 0 15px rgba(14, 165, 233, 0.4); }

        input[type="range"] { 
            width: 100%; 
            cursor: pointer; 
            accent-color: var(--accent);
        }

        .legend { 
            font-size: 0.85rem; 
            background: rgba(15, 23, 42, 0.5); 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: auto; 
            border: 1px solid #334155;
        }

        .canvas-container {
            flex-grow: 1;
            position: relative;
            background-color: var(--bg-main);
        }
        canvas { display: block; width: 100%; height: 100%; }

        .status-box {
            position: absolute;
            top: 64px;
            right: 24px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(4px);
            padding: 16px 20px;
            border-radius: 12px;
            pointer-events: none;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #334155;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            line-height: 1.6;
            color: var(--text-muted);
            min-width: 250px;
        }
        .highlight { color: var(--accent); font-weight: bold;}

        .btn-home {
            position: absolute; 
            top: 15px; 
            right: 25px; 
            z-index: 9999; 
            padding: 6px 12px; 
            background: rgba(30, 41, 59, 0.9); 
            border: 1px solid #334155; 
            color: var(--text-muted); 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 0.85rem;
            transition: all 0.2s ease-in-out;
        }
        .btn-home:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(14, 165, 233, 0.1);
        }
    </style>
    <link rel="stylesheet" href="/lab-common.css">
    <script src="/lab-runtime.js"></script>
</head>
<body>
<a href="/" class="btn-home"> 🏠 返回展厅 </a>
<div class="controls">
    <h2>小船渡河与速度合成</h2>
    
    <div class="control-group" style="margin-top: 10px;">
        <label>快速预设（基于当前速度）：</label>
        <button onclick="setShortestTime()">一键对齐：渡河时间最短 (θ=90°)</button>
        <button onclick="setShortestDisplacement()">智能计算：极值渡河位移最短</button>
    </div>

    <div class="control-group" style="margin-top: 15px;">
        <label><span>水流速度 v1:</span> <span id="val_v1" class="highlight" style="color:var(--v1-color)">30</span></label>
        <input type="range" id="input_v1" min="0" max="100" step="1" value="30">
    </div>

    <div class="control-group" style="margin-top: 5px;">
        <label><span>静水船速 v2:</span> <span id="val_v2" class="highlight" style="color:var(--v2-color)">50</span></label>
        <input type="range" id="input_v2" min="10" max="100" step="1" value="50">
    </div>

    <div class="control-group" style="margin-top: 5px;">
        <label><span>船头夹角 θ (°):</span> <span id="val_theta" class="highlight">90</span></label>
        <input type="range" id="input_theta" min="10" max="170" step="0.1" value="90">
        <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">注：夹角指船头与下游河岸(正X轴)的逆时针角度</div>
    </div>

    <div class="btn-group" style="margin-top: 15px;">
        <button id="btnRestart" onclick="resetSim()">↺ 重置位置</button>
        <button id="btnPlay" class="action-play" onclick="startSim()">▶ 开始渡河</button>
    </div>

    <div class="legend">
        <strong style="color:var(--text-main); display:block; margin-bottom:8px;">矢量图例：</strong>
        <div style="margin-bottom: 4px;"><span style="color:var(--v1-color); font-weight:bold;">🟩 绿色箭头</span>: 水流速 v1</div>
        <div style="margin-bottom: 4px;"><span style="color:var(--v2-color); font-weight:bold;">🟦 蓝色箭头</span>: 静水船速 v2</div>
        <div style="margin-bottom: 4px;"><span style="color:var(--vres-color); font-weight:bold;">🟥 红色箭头</span>: 实际合速度 v_res</div>
    </div>
</div>

<div class="canvas-container" id="canvas-container">
    <div class="status-box" id="statusBox">
        加载中...
    </div>
    <canvas id="simCanvas" role="img" tabindex="0" aria-label="小船渡河及水流速度和船速合成仿真"></canvas>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    // 逻辑常量与状态
    const RIVER_WIDTH = 400; // 河流像素宽度
    let originX = 0; // 下岸出发发点X
    let groundY = 0; // 下岸Y坐标
    let northY = 0;  // 上岸Y坐标

    let state = {
        v1: 30, // 水流速向右
        v2: 50, // 船静水速
        theta: 90, // 船头夹角，角度制
        
        x: 0, y: 0, // 船当前坐标
        history: [], // 轨迹
        
        running: false,
        finished: false,
        t: 0 // 耗时
    };

    let animationId = null;
    let lastFrameTime = 0;

    // UI 绑定
    const ui = {
        sliderV1: document.getElementById('input_v1'),
        sliderV2: document.getElementById('input_v2'),
        sliderTheta: document.getElementById('input_theta'),
        valV1: document.getElementById('val_v1'),
        valV2: document.getElementById('val_v2'),
        valTheta: document.getElementById('val_theta'),
        status: document.getElementById('statusBox'),
        btnPlay: document.getElementById('btnPlay')
    };

    function resize() {
        const container = document.getElementById('canvas-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        
        // 计算河流位置
        groundY = canvas.height / 2 + RIVER_WIDTH / 2;
        northY = canvas.height / 2 - RIVER_WIDTH / 2;
        originX = canvas.width / 2; 

        if(!state.running && !state.finished) resetSim();
        else drawFrame();
    }
    window.addEventListener('resize', resize);

    function updateParamsFromUI() {
        state.v1 = parseFloat(ui.sliderV1.value);
        state.v2 = parseFloat(ui.sliderV2.value);
        state.theta = parseFloat(ui.sliderTheta.value);
        
        ui.valV1.textContent = state.v1;
        ui.valV2.textContent = state.v2;
        ui.valTheta.textContent = state.theta;
        
        updateStatus();
        if(!state.running && !state.finished) {
            drawFrame(); // 实时预览偏转角
        }
    }

    ui.sliderV1.addEventListener('input', updateParamsFromUI);
    ui.sliderV2.addEventListener('input', updateParamsFromUI);
    ui.sliderTheta.addEventListener('input', updateParamsFromUI);

    function setShortestTime() {
        ui.sliderTheta.value = 90;
        updateParamsFromUI();
        resetSim();
    }

    function setShortestDisplacement() {
        let v1 = parseFloat(ui.sliderV1.value);
        let v2 = parseFloat(ui.sliderV2.value);
        let rad = 0;
        
        if (v2 > v1) {
            // 船速 > 水速：船可以提供足够分速度完全抵消横向水流，此时合速度完全垂直于对岸
            // 条件: v1 + v2 * cos(theta) = 0 => cos(theta) = -v1 / v2
            rad = Math.acos(-v1 / v2);
        } else {
            // 水速 >= 船速：船不管怎么划最终也会被冲向下游
            // 根据矢量圆找极值点，位移最短代表合速度要尽可能地陡峭，此时"船速垂直于合速度"
            // 条件: 船与水流的夹角为顿角且满足 cos(theta) = -v2 / v1
            rad = Math.acos(-v2 / v1);
        }
        
        // 保留1位小数精度设定回滑块
        ui.sliderTheta.value = (rad * 180 / Math.PI).toFixed(1);
        updateParamsFromUI();
        resetSim();
    }

    function resetSim() {
        state.x = originX;
        state.y = groundY;
        state.history = [{x: state.x, y: state.y}];
        state.running = false;
        state.finished = false;
        state.t = 0;
        
        ui.btnPlay.innerHTML = '▶ 开始渡河';
        ui.btnPlay.classList.add('action-play');
        ui.btnPlay.style.background = 'var(--accent)';
        updateStatus();
    }

    function startSim() {
        if (state.finished) {
            resetSim(); // 重置后再跑
        }
        
        state.running = !state.running;
        
        if (state.running) {
            ui.btnPlay.innerHTML = '⏸ 暂停';
            ui.btnPlay.style.background = '#eab308'; // 黄色暂停
        } else {
            ui.btnPlay.innerHTML = '▶ 继续渡河';
            ui.btnPlay.style.background = 'var(--accent)';
        }
    }

    function updateStatus() {
        // v2x = v2*cosA, v2y = -v2*sinA (因为y轴向下正)
        const rad = state.theta * Math.PI / 180;
        const v_res_x = state.v1 + state.v2 * Math.cos(rad);
        const v_res_y = state.v2 * Math.sin(rad); // 渡河方向(北)的速度大小绝对值
        
        const displacement = Math.hypot(state.x - originX, groundY - state.y);

        let info = "";
        if (state.finished) {
            info = `<span style="color:#4ade80">✅ 已达北岸</span>`;
        } else if (state.running) {
            info = `<span style="color:#eab308">渡河进行中...</span>`;
        } else {
            info = `等待开船`;
        }

        ui.status.innerHTML = `
            <div style="margin-bottom:8px; font-weight:bold; font-size:1.1em">${info}</div>
            <div style="margin-bottom:4px">河道宽度: ${RIVER_WIDTH} m</div>
            <div style="margin-bottom:4px">渡河耗时 t: <span style="color:#fff">${state.t.toFixed(1)}</span> s</div>
            <div style="margin-bottom:4px">总位移 s: <span style="color:#fff">${displacement.toFixed(1)}</span> m</div>
            <hr style="border-color:#334155; margin:8px 0;">
            <div style="margin-bottom:4px; font-size: 0.9em; color:#94a3b8">合速度绝对值 v: ${Math.hypot(v_res_x, v_res_y).toFixed(1)} m/s</div>
            <div style="margin-bottom:4px; font-size: 0.9em; color:#94a3b8">垂直河岸分速度: ${Math.abs(v_res_y).toFixed(1)} m/s</div>
        `;
    }

    function drawArrow(ctx, x, y, dx, dy, color, width) {
        if (Math.abs(dx) < 0.1 && Math.abs(dy) < 0.1) return;
        const endX = x + dx;
        const endY = y + dy;
        
        ctx.beginPath(); 
        ctx.moveTo(x, y); 
        ctx.lineTo(endX, endY);
        ctx.strokeStyle = color; 
        ctx.lineWidth = width; 
        ctx.lineCap = 'round';
        ctx.stroke();

        const angle = Math.atan2(dy, dx);
        const headLen = 10;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX - headLen * Math.cos(angle - Math.PI / 7), endY - headLen * Math.sin(angle - Math.PI / 7));
        ctx.lineTo(endX - headLen * Math.cos(angle + Math.PI / 7), endY - headLen * Math.sin(angle + Math.PI / 7));
        ctx.fillStyle = color; 
        ctx.fill();
    }

    function drawFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 绘制河流带有真实深度感的渐变色背景
        const gradient = ctx.createLinearGradient(0, northY, 0, groundY);
        gradient.addColorStop(0, '#0284c7');     // 远侧水体浅一些
        gradient.addColorStop(0.5, '#0369a1');   // 中间稍微深
        gradient.addColorStop(1, '#0c4a6e');     // 近岸最深
        ctx.fillStyle = gradient;
        ctx.fillRect(0, northY, canvas.width, RIVER_WIDTH);

        // 绘制河水形态波浪 (随全局时间不断推移，与水流速关联)
        const time = Date.now() / 1000;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
        ctx.lineWidth = 1.5;
        // 把水体切割出几层波浪
        for (let i = 1; i <= 6; i++) {
            ctx.beginPath();
            const yBase = northY + (RIVER_WIDTH / 7) * i;
            // 获取一个由水流速决定的位移偏移量
            const dx = (state.v1 * time * 0.5); 
            for (let x = 0; x <= canvas.width; x += 20) {
                // 利用正弦函数组合制造涟漪效果，同时随水流漂流
                const waveY = Math.sin(x/40 - time*2 + i) * 3 + Math.sin((x - dx)/60 + time) * 4;
                if (x === 0) ctx.moveTo(x, yBase + waveY);
                else ctx.lineTo(x, yBase + waveY);
            }
            ctx.stroke();
        }

        // 绘制河岸线
        ctx.beginPath();
        ctx.moveTo(0, northY); ctx.lineTo(canvas.width, northY);
        ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY);
        ctx.strokeStyle = '#cbd5e1';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 绘制起点记号
        ctx.beginPath();
        ctx.arc(originX, groundY, 4, 0, Math.PI*2);
        ctx.fillStyle = '#ef4444';
        ctx.fill();
        ctx.fillStyle = '#cbd5e1';
        ctx.font = '14px sans-serif';
        ctx.fillText("起点", originX - 14, groundY + 20);

        // 绘制对岸正对位置虚线
        ctx.beginPath();
        ctx.moveTo(originX, groundY);
        ctx.lineTo(originX, northY);
        ctx.setLineDash([5, 5]);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.lineWidth = 1;
        ctx.stroke();
        ctx.setLineDash([]);
        
        // 绘制轨迹虚线
        if (state.history.length > 1) {
            ctx.beginPath();
            ctx.moveTo(state.history[0].x, state.history[0].y);
            for (let i=1; i<state.history.length; i++) {
                ctx.lineTo(state.history[i].x, state.history[i].y);
            }
            ctx.setLineDash([8, 6]);
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.7)'; // 红虚线
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.setLineDash([]);
        }

        // 绘制小船
        ctx.beginPath();
        ctx.arc(state.x, state.y, 8, 0, Math.PI*2);
        ctx.fillStyle = '#f8fafc';
        ctx.fill();

        // 准备合成矢量的参数
        const rad = state.theta * Math.PI / 180;
        const v2x = state.v2 * Math.cos(rad);
        const v2y = -state.v2 * Math.sin(rad); // y向北减小
        const v1x = state.v1;
        const v1y = 0;
        
        const v_res_x = v1x + v2x;
        const v_res_y = v1y + v2y;

        // 放大系数用于可视化箭头长度
        const drawScale = 1.5; 

        // 绘制矢量关系 (平行四边形定则辅助线)
        if (!state.finished) {
            ctx.setLineDash([4, 4]);
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.beginPath();
            // 辅助线1：v1 终点到合速度终点
            ctx.moveTo(state.x + v1x * drawScale, state.y + v1y * drawScale);
            ctx.lineTo(state.x + v_res_x * drawScale, state.y + v_res_y * drawScale);
            // 辅助线2：v2 终点到合速度终点
            ctx.moveTo(state.x + v2x * drawScale, state.y + v2y * drawScale);
            ctx.lineTo(state.x + v_res_x * drawScale, state.y + v_res_y * drawScale);
            ctx.stroke();
            ctx.setLineDash([]);
            
            // 绘制三大矢量
            drawArrow(ctx, state.x, state.y, v1x * drawScale, v1y * drawScale, '#10b981', 3); // v1
            drawArrow(ctx, state.x, state.y, v2x * drawScale, v2y * drawScale, '#3b82f6', 3); // v2
            drawArrow(ctx, state.x, state.y, v_res_x * drawScale, v_res_y * drawScale, '#ef4444', 4); // resultant
        }
    }

    // 采用始终运作的全局主循环，以保证背景水波纹独立于船只持续渲染
    function gameLoop(timestamp) {
        const frameScale = PhysicsLab.frameScale(timestamp, lastFrameTime);
        lastFrameTime = timestamp;

        if (state.running) {
            const dt = 0.05 * frameScale; // 保持 60 Hz 下原有速度，同时消除刷新率差异
            
            const rad = state.theta * Math.PI / 180;
            const v_res_x = state.v1 + state.v2 * Math.cos(rad);
            const v_res_y = -state.v2 * Math.sin(rad);

            state.x += v_res_x * dt;
            state.y += v_res_y * dt;
            state.t += dt;

            state.history.push({x: state.x, y: state.y});

            // 终止条件：抵达北岸 (y <= northY)
            if (state.y <= northY) {
                state.y = northY;
                state.history.push({x: state.x, y: state.y}); // 最后补一针
                state.running = false;
                state.finished = true;
                ui.btnPlay.innerHTML = '↻ 重新开始';
                ui.btnPlay.style.background = '#64748b'; // 灰色
            }

            updateStatus();
        }

        drawFrame();
        requestAnimationFrame(gameLoop);
    }

    // 初始化
    setTimeout(() => {
        resize();
        updateParamsFromUI();
        requestAnimationFrame(gameLoop);
    }, 100);

</script>
</body>
</html>

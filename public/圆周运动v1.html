<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小球在竖直平面内通过圆轨道 (Physics Lab)</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --panel-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            
            --accent: #f59e0b;       /* 核心主色调: 力学琥珀色 */
            --track-color: #38bdf8;  /* 轨道蓝色 */
            --v-vector: #4ade80;     /* 速度矢量绿色 */
            --g-vector: #ef4444;     /* 重力矢量红色 */
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .controls {
            width: 320px;
            background-color: var(--panel-bg);
            padding: 20px;
            box-shadow: 4px 0 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
            z-index: 10;
            border-right: 1px solid #334155;
            overflow-y: auto;
        }
        .controls::-webkit-scrollbar { width: 6px; }
        .controls::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

        h2 { 
            margin: 0; 
            font-size: 1.3rem; 
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        h2::before {
            content: '';
            display: block;
            width: 5px;
            height: 24px;
            background: var(--accent);
            border-radius: 4px;
        }
        
        .control-group { display: flex; flex-direction: column; gap: 8px; }
        
        label { 
            display: flex; 
            justify-content: space-between; 
            font-size: 0.95rem; 
            color: var(--text-muted); 
            font-weight: 500;
        }
        
        button {
            width: 100%;
            padding: 10px;
            background: #334155;
            border: 1px solid #475569;
            color: var(--text-main);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 600;
            font-size: 0.95rem;
        }
        button:hover { background: #475569; }
        button.active { 
            background: rgba(245, 158, 11, 0.15); 
            color: var(--accent); 
            border-color: var(--accent); 
        }
        
        .btn-group { display: flex; gap: 10px; margin-top: 5px; }
        .btn-group button { flex: 1; margin: 0; }
        button.action-play { background: var(--accent); color: #fff; border: none; }
        button.action-play:hover { background: #d97706; box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }

        input[type="range"] { 
            width: 100%; 
            cursor: pointer; 
            accent-color: var(--accent);
        }

        .legend { 
            font-size: 0.85rem; 
            background: rgba(15, 23, 42, 0.5); 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: auto; 
            border: 1px solid #334155;
        }

        .canvas-container {
            flex-grow: 1;
            position: relative;
            background-image: 
                linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px; 
        }
        canvas { display: block; width: 100%; height: 100%; }

        .status-box {
            position: absolute;
            top: 24px;
            left: 24px;
            background: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(4px);
            padding: 16px 20px;
            border-radius: 12px;
            pointer-events: none;
            font-family: monospace;
            font-size: 14px;
            border: 1px solid #334155;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            line-height: 1.6;
            color: var(--text-muted);
            min-width: 250px;
        }
        .highlight { color: var(--accent); font-weight: bold; font-size: 1.1em;}

        .btn-home {
            position: absolute; 
            top: 15px; 
            right: 25px; 
            z-index: 9999; 
            padding: 6px 12px; 
            background: rgba(30, 41, 59, 0.9); 
            border: 1px solid #334155; 
            color: var(--text-muted); 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold; 
            font-size: 0.85rem;
            transition: all 0.2s ease-in-out;
        }
        .btn-home:hover {
            color: var(--accent);
            border-color: var(--accent);
            background: rgba(245, 158, 11, 0.1);
        }
    </style>
    <link rel="stylesheet" href="/lab-common.css">
    <script src="/lab-runtime.js"></script>
</head>
<body>
<a href="/" class="btn-home"> 🏠 返回展厅 </a>
<div class="controls">
    <h2>竖直平面圆轨道模型</h2>
    
    <div class="control-group" style="margin-top: 10px;">
        <label>快速情景切换：</label>
        <button id="btn-full" onclick="setMode(2.3)">v₀ ≥ √(5gR) [完整圆周]</button>
        <button id="btn-fall" onclick="setMode(1.8)">√(2gR) < v₀ < √(5gR) [脱轨离心]</button>
        <button id="btn-osc" class="active" onclick="setMode(1.2)">v₀ ≤ √(2gR) [内部摆动]</button>
    </div>

    <div class="control-group" style="margin-top: 15px;">
        <label><span>初速度 v₀ 乘数 (k * √(gR)):</span> <span id="val_v0" class="highlight">1.20</span></label>
        <input type="range" id="input_v0" min="0.5" max="3.0" step="0.05" value="1.2">
        <div style="font-size: 12px; color: var(--text-muted); line-height: 1.4; margin-top: 5px;">
            提示: <br>
            k = 1.414 (√2) 为过圆心等高处临界<br>
            k = 2.236 (√5) 为过最高点临界
        </div>
    </div>

    <div class="control-group" style="margin-top: 10px;">
        <label style="justify-content: flex-start; gap: 10px; cursor: pointer; color: var(--text-main);">
            <input type="checkbox" id="showVelocity" checked style="width: 16px; height: 16px;"> 显示速度矢量
        </label>
        <label style="justify-content: flex-start; gap: 10px; cursor: pointer; color: var(--text-main);">
            <input type="checkbox" id="showForce" style="width: 16px; height: 16px;"> 显示力的矢量
        </label>
        <label style="justify-content: flex-start; gap: 10px; cursor: pointer; color: var(--text-main);">
            <input type="checkbox" id="showTrail" checked style="width: 16px; height: 16px;"> 显示运动轨迹残影
        </label>
    </div>

    <div class="btn-group" style="margin-top: 5px;">
        <button id="btnRestart" onclick="resetSim()">↺ 重置底部</button>
        <button id="btnPause" class="action-play" onclick="togglePause()">⏯ 暂停 / 继续</button>
    </div>

    <div class="legend">
        <strong style="color:var(--text-main); display:block; margin-bottom:8px;">颜色图例：</strong>
        <div style="margin-bottom: 4px;"><span style="color:var(--v-vector); font-weight:bold;">🟩 绿色箭头</span>: 速度 (v)</div>
        <div style="margin-bottom: 4px;"><span style="color:var(--g-vector); font-weight:bold;">🟥 红色箭头</span>: 重力 (mg)</div>
        <div style="margin-bottom: 4px;"><span style="color:#a855f7; font-weight:bold;">🟪 紫色箭头</span>: 轨道支持力 (N)</div>
    </div>
</div>

<div class="canvas-container" id="canvas-container">
    <div class="status-box" id="statusBox">加载中...</div>
    <canvas id="simCanvas" role="img" tabindex="0" aria-label="小球在竖直圆轨道内运动、脱轨与受力仿真"></canvas>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    
    // 基础物理常量与环境
    const g = 0.15;       // 重力加速度 (px/frame^2) 定一个小一点的值以便于观察
    const R = 180;        // 轨道半径 (px)
    const criticalV_osc = Math.sqrt(2 * g * R); 
    const criticalV_full = Math.sqrt(5 * g * R);
    
    let state = {
        cx: 0, cy: 0,     // 圆心坐标
        groundY: 0,
        running: false,
        k: 1.2,           // 选择的系数 (v0 = k * sqrt(gR))
        
        // 运动状态
        mode: 'track',    // 'track' 轨道内运动, 'freefall' 自由落体式平抛/斜抛, 'ground' 落地停止
        angle: 0,         // 当前角度 (底部为0，逆时针为正，顺时针为负，最高点为 PI 或 -PI)
        v: 0,             // 沿轨道的线速度 (逆时针为正)
        
        x: 0, y: 0,       // 当前笛卡尔坐标 (脱轨时使用)
        vx: 0, vy: 0,     // 笛卡尔速度分量
        
        history: [],       // 用于绘制残影
        t: 0
    };

    let animationId = null;
    let lastFrameTime = 0;
    let statusFrameBudget = 0;

    // UI 绑定
    const ui = {
        v0Slider: document.getElementById('input_v0'),
        v0Val: document.getElementById('val_v0'),
        showVelocity: document.getElementById('showVelocity'),
        showForce: document.getElementById('showForce'),
        showTrail: document.getElementById('showTrail'),
        status: document.getElementById('statusBox'),
        btns: {
            full: document.getElementById('btn-full'),
            fall: document.getElementById('btn-fall'),
            osc: document.getElementById('btn-osc')
        }
    };

    function resize() {
        const container = document.getElementById('canvas-container');
        canvas.width = container.clientWidth;
        canvas.height = container.clientHeight;
        
        state.cx = canvas.width / 2 + 50; 
        state.groundY = canvas.height - 80;
        state.cy = state.groundY - R - 60; // 圆心高度，距离地面60px的柱子支撑
        
        drawFrame();
    }
    window.addEventListener('resize', resize);

    function setMode(kVal) {
        document.querySelectorAll('.control-group button').forEach(b => b.classList.remove('active'));
        if (kVal >= 2.3) ui.btns.full.classList.add('active');
        else if (kVal >= 1.45) ui.btns.fall.classList.add('active');
        else ui.btns.osc.classList.add('active');

        ui.v0Slider.value = kVal;
        state.k = kVal;
        ui.v0Val.textContent = kVal.toFixed(2);
        
        resetSim();
    }

    ui.v0Slider.addEventListener('input', (e) => {
        state.k = parseFloat(e.target.value);
        ui.v0Val.textContent = state.k.toFixed(2);
        document.querySelectorAll('.control-group button').forEach(b => b.classList.remove('active'));
        
        resetSim();
    });

    function resetSim() {
        state.mode = 'track';
        state.angle = 0; // 最底部
        state.v = state.k * Math.sqrt(g * R); // 往右抛（逆时针）
        state.history = [];
        state.t = 0;
        
        updateStatusText();
        
        if (!state.running) {
            drawFrame();
        }
    }

    function togglePause() {
        state.running = !state.running;
        if (state.running) {
            lastFrameTime = 0;
            animationId = requestAnimationFrame(animate);
        } else if (animationId) {
            cancelAnimationFrame(animationId);
            animationId = null;
        }
    }

    function updateStatusText() {
        let phenomenon = "";
        let N_status = "";
        if (state.k >= Math.sqrt(5)) {
            phenomenon = "完整圆周运动 (v₀ ≥ √5gR)";
        } else if (state.k > Math.sqrt(2)) {
            phenomenon = "将脱离轨道做斜抛 (√2gR < v₀ < √5gR)";
        } else {
            phenomenon = "在下半圆内往复摆动 (v₀ ≤ √2gR)";
        }

        let currV = 0, currHeight = 0, currN = 0;

        if (state.mode === 'track') {
            currV = Math.abs(state.v);
            currHeight = R - R * Math.cos(state.angle);
            currN = (currV * currV) / R + g * Math.cos(state.angle);
            N_status = currN > 0 ? currN.toFixed(2) : '0.00 (脱轨)';
        } else if (state.mode === 'freefall') {
            currV = Math.sqrt(state.vx*state.vx + state.vy*state.vy);
            currHeight = (state.groundY - 60) - state.y;
            currN = 0;
            N_status = '0.00 (脱轨中)';
        }

        ui.status.innerHTML = `
            <div style="margin-bottom:8px">预测: <span style="color:#f59e0b">${phenomenon}</span></div>
            <div style="margin-bottom:4px">状态: ${state.mode === 'track' ? '<span style="color:#4ade80">轨道约束中</span>' : (state.mode === 'freefall' ? '<span style="color:#ef4444">脱轨！自由落体中</span>' : '落地停止')}</div>
            <div style="margin-bottom:4px">速度 v = ${currV.toFixed(1)} px/s</div>
            <div style="margin-bottom:4px">高度 h = ${currHeight.toFixed(0)} px</div>
            <div style="margin-bottom:4px">支持力 N = ${N_status}</div>
        `;
    }

    function physicsStep(frameScale) {
        // 利用时间步细分保证 Euler 积分稳定性
        const substeps = 5;
        const dt = frameScale / substeps;
        
        for (let i = 0; i < substeps; i++) {
            if (state.mode === 'track') {
                // 圆周运动阶段
                // 角度从底部0度开始，逆时针为正，x=R*sin(A), y=R*cos(A)
                // 沿切线在逆时针方向的分量向上的趋势受到重力产生的负加速度
                const at = -g * Math.sin(state.angle);
                state.v += at * dt;
                state.angle += (state.v / R) * dt;

                while (state.angle > Math.PI) state.angle -= 2 * Math.PI;
                while (state.angle < -Math.PI) state.angle += 2 * Math.PI;

                // 计算支持力 N = v^2/R - mg*cos(pi - angle) => v^2/R + g*cos(angle)
                const N = (state.v * state.v) / R + g * Math.cos(state.angle);

                // 判断是否脱轨：在上半圆(cos<0) 且 N <= 0
                if (Math.cos(state.angle) < 0 && N <= 0) {
                    state.mode = 'freefall';
                    // 根据当前角度计算笛卡尔坐标和速度，准备抛体运动
                    // 坐标转化：圆心cx, cy。角度为0时在底部。
                    state.x = state.cx + R * Math.sin(state.angle);
                    state.y = state.cy + R * Math.cos(state.angle);
                    
                    // 速度分解
                    state.vx = state.v * Math.cos(state.angle);
                    state.vy = -state.v * Math.sin(state.angle);
                    break;
                }
            } else if (state.mode === 'freefall') {
                // 抛体运动阶段
                state.vy += g * dt;
                state.x += state.vx * dt;
                state.y += state.vy * dt;

                // 圆内壁碰撞判定：当小球到达圆轨道边缘，并且正在向外运动（防误判脱轨瞬间）
                const relX = state.x - state.cx;
                const relY = state.y - state.cy;
                const dist = Math.hypot(relX, relY);
                const dotProduct = state.vx * relX + state.vy * relY; // 速度与相对位置的点积

                if (dist >= R && dotProduct > 0) {
                    // 与轨道发生碰撞，切换回轨道内部约束模式
                    state.mode = 'track';
                    state.angle = Math.atan2(relX, relY);
                    
                    // 非弹性碰撞，仅保留轨道切向上的速度分量，法向被撞击吸收
                    state.v = state.vx * Math.cos(state.angle) - state.vy * Math.sin(state.angle);
                    
                    // 修正坐标使其完美贴合在轨道上
                    state.x = state.cx + R * Math.sin(state.angle);
                    state.y = state.cy + R * Math.cos(state.angle);
                }
            }
        }

        // 记录残影
        let currentPos = getBallPos();
        if (state.history.length === 0 || 
            Math.hypot(currentPos.x - state.history[state.history.length-1].x, currentPos.y - state.history[state.history.length-1].y) > 4) {
            state.history.push({x: currentPos.x, y: currentPos.y, mode: state.mode});
            if (state.history.length > 250) state.history.shift(); // 限制尾迹长度
        }
    }

    function getBallPos() {
        if (state.mode === 'track') {
            return {
                x: state.cx + R * Math.sin(state.angle),
                y: state.cy + R * Math.cos(state.angle)
            };
        } else {
            return { x: state.x, y: state.y };
        }
    }

    function drawArrow(ctx, x, y, dx, dy, color, width) {
        if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5) return;
        const endX = x + dx;
        const endY = y + dy;
        
        ctx.beginPath(); 
        ctx.moveTo(x, y); 
        ctx.lineTo(endX, endY);
        ctx.strokeStyle = color; 
        ctx.lineWidth = width; 
        ctx.lineCap = 'round';
        ctx.stroke();

        const angle = Math.atan2(dy, dx);
        const headLen = 10;
        ctx.beginPath();
        ctx.moveTo(endX, endY);
        ctx.lineTo(endX - headLen * Math.cos(angle - Math.PI / 7), endY - headLen * Math.sin(angle - Math.PI / 7));
        ctx.lineTo(endX - headLen * Math.cos(angle + Math.PI / 7), endY - headLen * Math.sin(angle + Math.PI / 7));
        ctx.fillStyle = color; 
        ctx.fill();
    }

    function drawFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 绘制支撑柱和小底座
        ctx.beginPath();
        ctx.rect(state.cx - 15, state.cy + R, 30, state.groundY - (state.cy + R));
        ctx.fillStyle = '#1e293b';
        ctx.fill();
        ctx.strokeStyle = '#334155';
        ctx.stroke();

        // 绘制地面
        ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
        ctx.fillRect(0, state.groundY, canvas.width, canvas.height - state.groundY);
        ctx.beginPath(); 
        ctx.moveTo(0, state.groundY); 
        ctx.lineTo(canvas.width, state.groundY);
        ctx.strokeStyle = '#475569';
        ctx.lineWidth = 4; 
        ctx.stroke();

        // 绘制圆轨道（外壁，使小球在视觉上完美包含在圆内）
        ctx.beginPath();
        ctx.arc(state.cx, state.cy, R + 10, 0, Math.PI * 2);
        ctx.strokeStyle = '#38bdf8'; // track color
        ctx.lineWidth = 3;
        ctx.stroke();
        
        // 沿轨道画内部虚线表示空心轨道内缘
        ctx.beginPath();
        ctx.arc(state.cx, state.cy, R - 10, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.2)';
        ctx.lineWidth = 1;
        ctx.stroke();

        // 绘制中心参考点和虚线十字
        ctx.beginPath();
        ctx.arc(state.cx, state.cy, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#94a3b8';
        ctx.fill();

        ctx.setLineDash([4, 4]);
        ctx.strokeStyle = 'rgba(148, 163, 184, 0.3)';
        ctx.beginPath();
        ctx.moveTo(state.cx - R - 20, state.cy);
        ctx.lineTo(state.cx + R + 20, state.cy);
        ctx.moveTo(state.cx, state.cy - R - 20);
        ctx.lineTo(state.cx, state.cy + R + 20);
        ctx.stroke();
        ctx.setLineDash([]);

        // 绘制尾迹残影
        if (ui.showTrail.checked && state.history.length > 1) {
            ctx.beginPath();
            ctx.moveTo(state.history[0].x, state.history[0].y);
            for (let i = 1; i < state.history.length; i++) {
                ctx.lineTo(state.history[i].x, state.history[i].y);
                // 如果模式变化断开重连
                if (state.history[i].mode !== state.history[i-1].mode) {
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(state.history[i].x, state.history[i].y);
                }
            }
            ctx.strokeStyle = 'rgba(245, 158, 11, 0.5)';
            ctx.lineWidth = 3;
            ctx.stroke();
        }

        // 获取小球当前确切坐标
        const pos = getBallPos();

        // 绘制小球
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 10, 0, Math.PI * 2);
        ctx.fillStyle = '#f59e0b';
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#d97706';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.shadowBlur = 0;

        // 绘制矢量箭头
        if (state.mode !== 'ground') {
            const scaleV = 3; // 速度箭头缩放
            const scaleF = 150; // 力箭头缩放调短 (原400 -> 150)

            let vx = 0, vy = 0;
            if (state.mode === 'track') {
                vx = state.v * Math.cos(state.angle);
                vy = -state.v * Math.sin(state.angle);
            } else {
                vx = state.vx;
                vy = state.vy;
            }

            // 速度矢量 (绿)
            if (ui.showVelocity.checked) {
                drawArrow(ctx, pos.x, pos.y, vx * scaleV, vy * scaleV, '#4ade80', 3);
            }

            // 力矢量 (红/紫)
            if (ui.showForce.checked) {
                // 重力矢量 (红，恒定向下)
                drawArrow(ctx, pos.x, pos.y, 0, g * scaleF, '#ef4444', 3);

                // 轨道支持力/弹力 (紫)
                if (state.mode === 'track') {
                    const N = (state.v * state.v) / R + g * Math.cos(state.angle);
                    if (N > 0) {
                        // 支持力从轨道指向球心，方向为向内（指向圆心）
                        const nx = -Math.sin(state.angle) * N * scaleF;
                        const ny = -Math.cos(state.angle) * N * scaleF;
                        drawArrow(ctx, pos.x, pos.y, nx, ny, '#a855f7', 3);
                    }
                }
            }
        }
    }

    function animate(timestamp) {
        if (!state.running) return;

        const frameScale = PhysicsLab.frameScale(timestamp, lastFrameTime);
        lastFrameTime = timestamp;
        physicsStep(frameScale);
        state.t += frameScale;
        statusFrameBudget += frameScale;
        if (statusFrameBudget >= 5) {
            updateStatusText();
            statusFrameBudget = 0;
        }
        
        drawFrame();
        
        animationId = requestAnimationFrame(animate);
    }

    // 初始化运行
    setTimeout(() => {
        resize();
        resetSim();
    }, 100);

</script>
</body>
</html>

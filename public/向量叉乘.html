<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07101d">
  <title>向量叉乘：大小、方向与分量计算</title><link rel="stylesheet" href="/lab-common.css"><script src="/lab-runtime.js"></script>
  <style>
    :root{--bg:#07101d;--panel:#101c2c;--line:#293a50;--text:#eef7ff;--muted:#91a5bb;--a:#35d2ff;--b:#ffc857;--c:#ff5f83;--green:#56e3a3}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;display:flex;background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}.controls{width:375px;flex:0 0 auto;padding:19px 21px;background:linear-gradient(180deg,#142238,#0c1727);border-right:1px solid var(--line);overflow:auto;box-shadow:12px 0 36px #0006;z-index:3}h1{margin:0 0 4px;font-size:1.35rem}.lead{margin:0 0 13px;color:var(--muted);font-size:.85rem;line-height:1.5}.mode-tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:4px;background:#081421;border:1px solid var(--line);border-radius:10px;margin:11px 0}.mode-tabs button,.preset button{border:0;border-radius:7px;padding:8px;background:transparent;color:#91a5bb;cursor:pointer}.mode-tabs button.active{background:#23425d;color:#fff}.formula{padding:10px 12px;background:#081522;border:1px solid #284761;border-radius:10px;text-align:center;color:#d8efff;font-family:Cambria,"Times New Roman",serif;line-height:1.65}.formula strong{display:block;color:var(--c);font-size:1.08rem}.group{margin:11px 0}.group>label{display:flex;justify-content:space-between;color:var(--muted);font-size:.84rem;margin-bottom:5px}.value{font-weight:700;color:#dff6ff;font-variant-numeric:tabular-nums}input[type=range]{width:100%;accent-color:var(--a)}.b-range{accent-color:var(--b)!important}.component-panel{display:none}.component-panel.show{display:block}.component-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;margin:10px 0}.component{padding:7px 9px;background:#0a1725;border:1px solid #233950;border-radius:8px}.component label{display:flex;justify-content:space-between;font-size:.76rem;color:#a9bbcd}.component input{margin:4px 0 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:11px}.row button{border:1px solid #38536d;border-radius:8px;background:#1b3048;color:#eaf5ff;padding:9px 4px;cursor:pointer;font-weight:650}.row .primary{background:var(--a);border-color:transparent;color:#06202c}.row .active{background:var(--c);border-color:transparent}.preset{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:8px}.preset button{background:#17293e;border:1px solid #2d455e;font-size:.76rem;padding:7px 2px}.identity{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);color:#b9c8d7;font-size:.8rem;line-height:1.65}.identity b{color:var(--c)}.apps{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.apps span{padding:3px 7px;background:#17283b;border-radius:5px;color:#9eb2c5;font-size:.72rem}
    .stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden}canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}.home{position:absolute;right:15px;top:14px;padding:7px 11px;color:#b9c9d9;text-decoration:none;background:#091522df;border:1px solid var(--line);border-radius:8px;font-size:.81rem}.result{position:absolute;left:17px;top:16px;width:min(340px,calc(100% - 34px));padding:13px 15px;background:#081522e7;border:1px solid #2d4962;border-radius:12px;backdrop-filter:blur(8px);box-shadow:0 9px 30px #0005;pointer-events:none}.result-title{font-size:.76rem;color:#8fa5ba;letter-spacing:.08em;margin-bottom:7px}.result-vector{font-family:Cambria,"Times New Roman",serif;font-size:1.14rem;color:var(--c);margin-bottom:4px}.result-meta{font-size:.79rem;color:#afc0d0;line-height:1.6}.magnitude{position:absolute;right:17px;bottom:16px;width:190px;padding:10px 12px;background:#081522df;border:1px solid var(--line);border-radius:10px}.mag-head{display:flex;justify-content:space-between;color:#bbcbd9;font-size:.75rem;margin-bottom:7px}.mag-track{height:7px;background:#26384b;border-radius:8px;overflow:hidden}.mag-fill{height:100%;width:0;background:linear-gradient(90deg,#ff9aae,var(--c));box-shadow:0 0 10px #ff5f8388}.hint{position:absolute;left:50%;bottom:17px;transform:translateX(-50%);padding:6px 10px;background:#071421aa;border:1px solid #263d54;border-radius:7px;color:#8fa5ba;font-size:.74rem;pointer-events:none;white-space:nowrap}
    @media(max-width:900px){body{height:100dvh}.controls{width:100%;max-height:47dvh;padding:12px 15px}.lead,.identity{display:none}.group{margin:7px 0}.component-grid{margin:6px 0}.stage{min-height:53dvh}.result{left:8px;top:8px;width:auto;max-width:calc(100% - 100px);padding:8px 10px}.result-meta{font-size:.7rem}.magnitude{right:8px;bottom:8px}.hint{display:none}}
  </style>
</head>
<body>
  <aside class="controls"><h1>向量叉乘 · Cross Product</h1><p class="lead">动态理解“模等于平行四边形面积，方向垂直于两向量平面”。拖动画面可旋转观察。</p>
    <nav class="mode-tabs"><button class="active" data-mode="geometry">夹角法</button><button data-mode="components">分量法</button></nav>
    <div class="formula"><span id="formulaMain">|A × B| = AB sinθ</span><strong id="formulaResult"></strong><span id="formulaDirection">方向：右手四指从 A 转向 B，大拇指所指</span></div>
    <section id="geometryPanel">
      <div class="group"><label>向量 A 的模 <span class="value" id="aMagText"></span></label><input id="aMag" type="range" min="1" max="6" step="0.1" value="4"></div>
      <div class="group"><label>向量 B 的模 <span class="value" id="bMagText"></span></label><input class="b-range" id="bMag" type="range" min="1" max="6" step="0.1" value="3.5"></div>
      <div class="group"><label>从 A 到 B 的夹角 θ <span class="value" id="thetaText"></span></label><input id="theta" type="range" min="0" max="180" step="1" value="60"></div>
      <div class="preset"><button data-angle="0">平行 0°</button><button data-angle="90">垂直 90°</button><button data-angle="180">反向 180°</button></div>
    </section>
    <section class="component-panel" id="componentPanel"><div class="component-grid" id="componentGrid"></div></section>
    <div class="row"><button class="primary" id="sweep">▶ 扫描夹角</button><button id="reverse">A × B</button></div>
    <div class="row"><button id="areaToggle">▰ 显示面积</button><button id="rotateToggle">↻ 自动旋转</button></div>
    <div class="identity"><b>竞赛速记</b><br>A×B=−B×A，A×A=0；叉积不满足交换律，但对加法满足分配律。若 A、B 平行，叉积为零，方向不确定。<div class="apps"><span>力矩 τ=r×F</span><span>角动量 L=r×p</span><span>洛伦兹力 F=qv×B</span></div></div>
  </aside>
  <main class="stage" id="stage"><canvas id="canvas" aria-label="向量叉乘大小、方向、右手定则和平行四边形面积三维动态演示"></canvas><a class="home" href="/">⌂ 返回展厅</a>
    <div class="result"><div class="result-title">实时计算</div><div class="result-vector" id="resultVector"></div><div class="result-meta" id="resultMeta"></div></div>
    <div class="magnitude"><div class="mag-head"><span>叉积大小</span><b id="magLabel"></b></div><div class="mag-track"><div class="mag-fill" id="magFill"></div></div></div><div class="hint">拖动画面旋转视角 · 滚轮缩放</div>
  </main>
<script>
const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),stage=$('stage');
const ui={aMag:$('aMag'),bMag:$('bMag'),theta:$('theta'),sweep:$('sweep'),reverse:$('reverse'),area:$('areaToggle'),rotate:$('rotateToggle')};
const compIds=['ax','ay','az','bx','by','bz'],defaults={ax:4,ay:1,az:0,bx:-1,by:3,bz:2};let mode='geometry',reversed=false,showArea=true,sweeping=false,autoRotate=false,yaw=-.65,pitch=.52,zoom=1,last=performance.now(),W=0,H=0,dpr=1;
const v=(x=0,y=0,z=0)=>({x,y,z}),add=(a,b)=>v(a.x+b.x,a.y+b.y,a.z+b.z),mul=(a,k)=>v(a.x*k,a.y*k,a.z*k),dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z,cross=(a,b)=>v(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x),mag=a=>Math.hypot(a.x,a.y,a.z),unit=a=>mag(a)<1e-9?v():mul(a,1/mag(a)),clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),fmt=x=>(Math.abs(x)<.0005?0:x).toFixed(2);
function makeComponents(){const grid=$('componentGrid');compIds.forEach(id=>{const isA=id[0]==='a',axis=id[1].toUpperCase(),box=document.createElement('div');box.className='component';box.innerHTML=`<label><span>${isA?'A':'B'}<sub>${axis.toLowerCase()}</sub></span><b id="${id}Text">${defaults[id]}</b></label><input id="${id}" class="${isA?'':'b-range'}" type="range" min="-5" max="5" step="0.1" value="${defaults[id]}">`;grid.appendChild(box);box.querySelector('input').addEventListener('input',()=>{sweeping=false;updateButtons();draw()})})}
function vectors(){if(mode==='geometry'){const t=+ui.theta.value*Math.PI/180;return{A:v(+ui.aMag.value,0,0),B:v(+ui.bMag.value*Math.cos(t),+ui.bMag.value*Math.sin(t),0)}}return{A:v(+$('ax').value,+$('ay').value,+$('az').value),B:v(+$('bx').value,+$('by').value,+$('bz').value)}}
function project(p,scale,cx,cy){const u=-(Math.cos(yaw)*p.x+Math.sin(yaw)*p.y),d=-Math.sin(yaw)*p.x+Math.cos(yaw)*p.y,svert=Math.cos(pitch)*p.z-Math.sin(pitch)*d;return{x:cx+u*scale,y:cy-svert*scale,depth:Math.cos(pitch)*d+Math.sin(pitch)*p.z}}
function viewDirection(){return v(-Math.cos(pitch)*Math.sin(yaw),Math.cos(pitch)*Math.cos(yaw),Math.sin(pitch))}
function arrow3(a,color,label,scale,cx,cy,width=3){const O=project(v(),scale,cx,cy),P=project(a,scale,cx,cy),ang=Math.atan2(P.y-O.y,P.x-O.x),head=10;ctx.beginPath();ctx.moveTo(O.x,O.y);ctx.lineTo(P.x,P.y);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.stroke();ctx.beginPath();ctx.moveTo(P.x,P.y);ctx.lineTo(P.x-head*Math.cos(ang-.43),P.y-head*Math.sin(ang-.43));ctx.lineTo(P.x-head*Math.cos(ang+.43),P.y-head*Math.sin(ang+.43));ctx.fillStyle=color;ctx.fill();ctx.font='bold 14px Segoe UI';ctx.fillText(label,P.x+8,P.y-7)}
function line3(a,b,color,width,scale,cx,cy,dash=[]){const A=project(a,scale,cx,cy),B=project(b,scale,cx,cy);ctx.beginPath();ctx.moveTo(A.x,A.y);ctx.lineTo(B.x,B.y);ctx.setLineDash(dash);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([])}
function polygon3(points,color,scale,cx,cy){ctx.beginPath();points.forEach((p,i)=>{const q=project(p,scale,cx,cy);i?ctx.lineTo(q.x,q.y):ctx.moveTo(q.x,q.y)});ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.strokeStyle='#b8d9eb55';ctx.lineWidth=1;ctx.stroke()}
function grid3(scale,cx,cy){for(let i=-5;i<=5;i++){line3(v(i,-5,0),v(i,5,0),i===0?'#496078':'#203247',i===0?1.5:1,scale,cx,cy);line3(v(-5,i,0),v(5,i,0),i===0?'#496078':'#203247',i===0?1.5:1,scale,cx,cy)}arrow3(v(5.4,0,0),'#5f7890','x',scale,cx,cy,1.5);arrow3(v(0,5.4,0),'#5f7890','y',scale,cx,cy,1.5);arrow3(v(0,0,5),'#5f7890','z',scale,cx,cy,1.5)}
function angleArc(A,B,scale,cx,cy){const ma=mag(A),mb=mag(B);if(ma<1e-8||mb<1e-8)return;const e1=unit(A),co=clamp(dot(A,B)/(ma*mb),-1,1),theta=Math.acos(co);if(theta<.015||Math.PI-theta<.015)return;const e2=unit(add(unit(B),mul(e1,-co))),r=Math.min(ma,mb)*.34,pts=[];for(let i=0;i<=45;i++){const t=theta*i/45;pts.push(mul(add(mul(e1,Math.cos(t)),mul(e2,Math.sin(t))),r))}for(let i=1;i<pts.length;i++)line3(pts[i-1],pts[i],'#d7e8f7',2,scale,cx,cy);const p=project(pts[Math.floor(pts.length/2)],scale,cx,cy);ctx.fillStyle='#dcecff';ctx.font='13px Segoe UI';ctx.fillText(`θ=${(theta*180/Math.PI).toFixed(1)}°`,p.x+5,p.y-5)}
function normalDisplay(C,maxCross){const m=mag(C);if(m<1e-8)return v();const ratio=clamp(m/maxCross,0,1),len=.25+4.3*ratio;return mul(unit(C),len)}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#07101d';ctx.fillRect(0,0,W,H);const{A,B}=vectors(),first=reversed?B:A,second=reversed?A:B,C=cross(first,second),mA=mag(A),mB=mag(B),mC=mag(C),theta=mA*mB?Math.acos(clamp(dot(A,B)/(mA*mB),-1,1)):0,maxBase=Math.max(6,mA,mB),scale=Math.min(W,H)*.074*zoom,cx=W*.53,cy=H*.56;grid3(scale,cx,cy);if(showArea&&mA>1e-8&&mB>1e-8){polygon3([v(),A,add(A,B),B],'#35d2ff1c',scale,cx,cy);line3(A,add(A,B),'#ffc85788',1.4,scale,cx,cy,[6,5]);line3(B,add(A,B),'#35d2ff88',1.4,scale,cx,cy,[6,5])}angleArc(first,second,scale,cx,cy);arrow3(A,'#35d2ff','A',scale,cx,cy,3.5);arrow3(B,'#ffc857','B',scale,cx,cy,3.5);const maxCross=mode==='geometry'?36:75,shownC=normalDisplay(C,maxCross);if(mC>1e-8)arrow3(shownC,'#ff5f83',reversed?'B×A':'A×B',scale,cx,cy,4.5);else{const O=project(v(),scale,cx,cy);ctx.beginPath();ctx.arc(O.x,O.y,8,0,Math.PI*2);ctx.strokeStyle='#ff5f83';ctx.lineWidth=3;ctx.stroke()}updateUI(A,B,C,theta,mC,maxCross)}
function updateUI(A,B,C,theta,mC,maxCross){$('aMagText').textContent=(+ui.aMag.value).toFixed(1);$('bMagText').textContent=(+ui.bMag.value).toFixed(1);$('thetaText').textContent=(+ui.theta.value).toFixed(0)+'°';compIds.forEach(id=>{const el=$(id+'Text');if(el)el.textContent=(+$(id).value).toFixed(1)});$('formulaMain').textContent=mode==='geometry'?'|A × B| = AB sinθ':'A × B = (AᵧB𝓏−A𝓏Bᵧ, A𝓏Bₓ−AₓB𝓏, AₓBᵧ−AᵧBₓ)';$('formulaResult').textContent=`|${reversed?'B × A':'A × B'}| = ${fmt(mC)}`;$('formulaDirection').textContent=mC<1e-8?'两向量平行或有零向量，方向不确定':`单位方向 n̂ = (${fmt(C.x/mC)}, ${fmt(C.y/mC)}, ${fmt(C.z/mC)})`;$('resultVector').textContent=`${reversed?'B × A':'A × B'} = (${fmt(C.x)}, ${fmt(C.y)}, ${fmt(C.z)})`;const facing=dot(C,viewDirection()),viewMark=mC<1e-8?'—':facing>=0?'⊙ 朝向观察者':'⊗ 背向观察者';$('resultMeta').innerHTML=`右手系：+x × +y = +z　·　${viewMark}<br>|A|=${fmt(mag(A))}　|B|=${fmt(mag(B))}　θ=${(theta*180/Math.PI).toFixed(1)}°<br>平行四边形面积 = ${fmt(mC)}${mC<1e-8?'　·　方向不确定':''}`;$('magLabel').textContent=fmt(mC);$('magFill').style.width=clamp(mC/maxCross*100,0,100)+'%'}
function updateButtons(){ui.sweep.textContent=sweeping?'❚❚ 停止扫描':'▶ 扫描夹角';ui.sweep.classList.toggle('active',sweeping);ui.reverse.textContent=reversed?'当前：B × A':'当前：A × B';ui.reverse.classList.toggle('active',reversed);ui.area.textContent=showArea?'▰ 隐藏面积':'▱ 显示面积';ui.rotate.textContent=autoRotate?'❚❚ 停止旋转':'↻ 自动旋转';ui.rotate.classList.toggle('active',autoRotate)}
document.querySelectorAll('[data-mode]').forEach(btn=>btn.onclick=()=>{mode=btn.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b===btn));$('geometryPanel').style.display=mode==='geometry'?'block':'none';$('componentPanel').classList.toggle('show',mode==='components');sweeping=false;updateButtons();draw()});document.querySelectorAll('[data-angle]').forEach(btn=>btn.onclick=()=>{ui.theta.value=btn.dataset.angle;sweeping=false;updateButtons();draw()});
[ui.aMag,ui.bMag,ui.theta].forEach(el=>el.addEventListener('input',()=>{if(el===ui.theta)sweeping=false;updateButtons();draw()}));ui.sweep.onclick=()=>{if(mode!=='geometry'){mode='geometry';document.querySelector('[data-mode="geometry"]').click()}sweeping=!sweeping;updateButtons()};ui.reverse.onclick=()=>{reversed=!reversed;updateButtons();draw()};ui.area.onclick=()=>{showArea=!showArea;updateButtons();draw()};ui.rotate.onclick=()=>{autoRotate=!autoRotate;updateButtons()};
let drag=null;canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag.yaw+(e.clientX-drag.x)*.009;pitch=clamp(drag.pitch-(e.clientY-drag.y)*.009,-1.3,1.3);draw()});canvas.addEventListener('pointerup',()=>drag=null);canvas.addEventListener('pointercancel',()=>drag=null);canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=clamp(zoom*Math.exp(-e.deltaY*.001),.65,1.55);draw()},{passive:false});
function resize(){const r=stage.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}function animate(now){const dt=Math.min((now-last)/1000,.05);last=now;if(sweeping&&mode==='geometry'){let a=+ui.theta.value+30*dt;if(a>180)a=0;ui.theta.value=a}if(autoRotate)yaw+=dt*.28;if(sweeping||autoRotate)draw();requestAnimationFrame(animate)}
makeComponents();updateButtons();window.addEventListener('resize',resize);resize();requestAnimationFrame(t=>{last=t;animate(t)});
</script></body></html>
